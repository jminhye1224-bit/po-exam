<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의지보조기기사 60분 모의시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 배치: 시험지처럼 좁은 한 단(최대 760px). 문제 줄기는 명조, 조작부는 고딕. */
:root{
  --paper:#f4f6f3; --surface:#ffffff; --ink:#16302b; --muted:#5b6d68; --line:#d7deda;
  --accent:#0d6b5f; --accent-ink:#ffffff; --tint:#e4f0ed;
  --good:#1c8048; --mid:#b07a1a; --bad:#bf3b2c; --badtint:#fbe9e6; --goodtint:#e3f3ea;
  --display:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101816; --surface:#17221f; --ink:#e4ede9; --muted:#9aaea8; --line:#2a3a35;
    --accent:#45bba8; --accent-ink:#06211c; --tint:#1d302c;
    --good:#55c587; --mid:#e0ab4f; --bad:#f08575; --badtint:#3a211d; --goodtint:#1b3327;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101816; --surface:#17221f; --ink:#e4ede9; --muted:#9aaea8; --line:#2a3a35;
  --accent:#45bba8; --accent-ink:#06211c; --tint:#1d302c;
  --good:#55c587; --mid:#e0ab4f; --bad:#f08575; --badtint:#3a211d; --goodtint:#1b3327;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
#main{display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:15px;background:none;border:0;color:var(--ink);padding:4px 0;cursor:pointer}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.err::before{background:var(--bad)} .sync.local::before{background:var(--mid)}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:30px} h2{font-size:19px;margin-bottom:10px}
.eyebrow{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.lead{margin:8px 0 0;color:var(--muted);max-width:62ch}
.muted{color:var(--muted);font-size:14px;margin:4px 0}
.hero{padding:12px 0 4px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero .lead{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.card.center{text-align:center} .card.center .lead{margin-left:auto;margin-right:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row.cjust{justify-content:center} .row.between{justify-content:space-between}
.btn{font:inherit;font-weight:500;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{font-size:19px;padding:16px 36px}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ddayrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ddayrow input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.dday{color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:13px;color:var(--muted)} .tile b{font-size:22px;font-variant-numeric:tabular-nums} .tile em{font-style:normal;font-size:13px;color:var(--muted)}
.tile.warn{border-color:var(--bad)} .tile.warn b{color:var(--bad)}
.flow{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.foot{font-size:13px;color:var(--muted);margin:0}
.notice{background:var(--tint);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;width:100%}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.steps li span{font-variant-numeric:tabular-nums;font-weight:600}
.steps li.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.done{color:var(--accent);border-color:var(--accent)}
/* 시험 */
.exambar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line)}
.timer{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;min-width:86px}
.timer.low{color:var(--bad)}
.count{flex:1;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--accent);border:1px solid transparent}
.chip.bad{background:var(--badtint);color:var(--bad)}
.flagbtn{cursor:pointer;background:transparent;border-color:var(--line);color:var(--muted)}
.flagbtn.on{background:var(--mid);border-color:var(--mid);color:#fff}
.stem{font-family:var(--display);font-size:18.5px;font-weight:500;line-height:1.6;margin:0 0 14px;max-width:64ch}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt,.opts.static li{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:1.55;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.opt{cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
.n{flex:none;font-size:17px;line-height:1.45}
.opt.right,.opts.static li.right{border-color:var(--good);background:var(--goodtint)}
.opt.wrong,.opts.static li.wrong{border-color:var(--bad);background:var(--badtint)}
.opts.static li em{margin-left:auto;flex:none;font-style:normal;font-size:12px;font-weight:600;padding-left:10px}
.opts.static li.right em{color:var(--good)} .opts.static li.wrong em{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.g{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;padding:7px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer}
.g.ans{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.g.fl{box-shadow:inset 0 -4px 0 var(--mid)}
.g.cur{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
/* 결과·오답 */
.score{font-family:var(--display);font-size:64px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--muted);font-weight:500}
.score.perfect{color:var(--good)}
.ox{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.ox span{text-align:center;font-size:13px;padding:6px 0;border-radius:6px;font-variant-numeric:tabular-nums}
.ox .o{background:var(--goodtint);color:var(--good)} .ox .x{background:var(--bad);color:#fff;font-weight:600}
.exp,.loc{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:15px}
.exp{background:var(--tint)} .exp b,.loc b{margin-right:6px}
.loc{border:1px dashed var(--accent);color:var(--accent)}
.notelabel{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--muted)}
.note{width:100%;margin-top:6px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:4px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} .tbl td.bad{color:var(--bad);font-weight:600}
.barcell{width:34%;min-width:70px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.good{background:var(--good)} .bar i.mid{background:var(--mid)} .bar i.bad{background:var(--bad)}
.pages{display:flex;gap:8px;flex-wrap:wrap}
.pg{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--muted)} .pg b{color:var(--ink);margin-right:6px}
.memo,.mynotes,.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.memo li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mq{font-size:14px;color:var(--muted);grid-column:1 / -1}
.ma{font-weight:600} .mp{font-size:13px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.mynotes li{padding:10px 0;border-bottom:1px solid var(--line)} .mynotes p{margin:4px 0 0;white-space:pre-wrap}
.memo li:last-child,.mynotes li:last-child{border-bottom:0}
.chartwrap{overflow-x:auto;margin:8px 0}
svg .goal{stroke:var(--good);stroke-dasharray:4 4} svg .base{stroke:var(--line)}
svg .ax{fill:var(--muted);font-size:11px;font-family:var(--body)} svg .mid{text-anchor:middle}
svg .val{fill:var(--ink);font-size:12px;font-weight:600;text-anchor:middle;font-family:var(--body)}
svg .b{fill:var(--line)} svg .blast{fill:var(--accent)} svg .b100{fill:var(--good)}
.link{font:inherit;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;text-align:left;text-decoration:underline;font-variant-numeric:tabular-nums}
.chip.mid{background:var(--mid);color:#fff}
.ox .f{box-shadow:inset 0 -4px 0 var(--mid)}
.ready{padding:32px 20px}
.cheer{font-size:24px;margin:6px auto 0;max-width:22ch}
.verse{margin:22px auto 14px;padding:18px 20px;max-width:52ch;background:var(--tint);border-radius:10px;border-left:4px solid var(--accent);text-align:left}
.verse p{margin:0;font-family:var(--display);font-size:18px;line-height:1.8}
.verse cite{display:block;margin-top:10px;font-style:normal;font-size:13.5px;color:var(--accent);font-weight:600}
@media (max-width:420px){h1{font-size:25px}.card{padding:16px}.score{font-size:52px}.stem{font-size:17.5px}.barcell{display:none}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.g{transition:border-color .12s,background-color .12s}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><button class="brand" data-act="home">의지·보조기기사 모의시험</button><span class="sync wait" id="sync">저장소 연결 중</span></header>
<main id="main"></main>
</div>
<script>
/* 문제은행 1 — 절단·절단 후 관리·팔 의지 (한글파일 1~8쪽). 보기의 첫 번째가 정답, 화면에서는 섞어서 냄 */
const BANK=[];
function Q(sec,p,col,topic,head,stem,opts,exp){BANK.push({id:'q'+(BANK.length+1),sec,p,col,topic,head,stem,opts,exp});}

/* ===== A. 절단 총론 (1쪽 ~ 2쪽 왼쪽) ===== */
Q('A',1,'L','절단발생','절단 발생','현재 절단의 원인으로 가장 많은 것은?',['혈관질환','전쟁으로 인한 외상','종양','선천적 기형','감염'],'과거에는 전쟁으로 인한 외상, 현재는 혈관질환이 가장 많고 외상·종양에 의한 절단은 감소 추세.');
Q('A',1,'L','절단발생','절단 발생','절단단을 봉합(꿰맴)하는 절단은?',['폐쇄성 절단','개방성 절단','관절 이단','회전성형술','근성형 절단술'],'폐쇄성 절단: 절단단을 봉합하는 것. 개방성 절단: 감염이 남아 열어 놓는 것.');
Q('A',1,'L','절단발생','절단 발생','개방성 절단을 시행하는 이유로 옳은 것은?',['절단 부위에 감염이 남아 있어 열어 놓는다','절단단을 원추형으로 만들기 위해서이다','조기 보행을 하기 위해서이다','환각통을 줄이기 위해서이다','의지 제작 시간을 줄이기 위해서이다'],'개방성 절단: 절단 부위에 감염이 남아 열어 놓음.');
Q('A',1,'L','절단원인','2. 절단 원인','하지(다리) 절단의 주요 원인을 많은 순서대로 나열한 것은?',['말초혈관 질환 – 외상 – 감염 – 종양 – 선천적 기형','외상 – 말초혈관 질환 – 감염 – 종양 – 선천적 기형','말초혈관 질환 – 감염 – 외상 – 선천적 기형 – 종양','외상 – 선천적 기형 – 말초혈관 질환 – 종양 – 감염','종양 – 외상 – 말초혈관 질환 – 감염 – 선천적 기형'],'하지 절단 주요 원인: 말초혈관 질환, 외상, 감염, 종양, 선천적 기형 순.');
Q('A',1,'L','절단원인','2. 절단 원인','상지(팔) 절단의 주요 원인 중 가장 먼저 제시된 것은?',['외상','말초혈관 질환','종양','선천적 기형','감염'],'상지 절단 주요 원인: 외상, 선천적 기형, 말초혈관 질환, 종양. (하지는 말초혈관 질환이 먼저)');
Q('A',1,'L','절단원인','2. 절단 원인','하지 절단은 상지 절단에 비해 몇 배 많은가?',['10배','2배','3배','5배','20배'],'하지 절단이 상지 절단에 비해 10배 많음.');
Q('A',1,'L','절단원인','2. 절단 원인 1) 혈관질환','폐색성 혈전 혈관염에 대한 설명으로 옳은 것은?',['말초동맥과 정맥에 염증이 생기며 원인불명이고 청장년층 남성에게 주로 발생한다','노년층 여성에게 주로 발생한다','외상에 의한 절단 원인으로 분류된다','세균 감염이 원인으로 밝혀져 있다','림프관에만 염증이 생긴다'],'폐색성 혈전 혈관염: 말초동맥과 정맥에 염증, 원인불명, 청장년층 남성에게 주로 발생. 혈관질환에 속함.');
Q('A',1,'L','절단원인','2. 절단 원인 1) 혈관질환 / 2) 외상','절단 원인 중 「외상」이 아닌 「혈관질환」에 해당하는 것은?',['레이노드 병','압좌상','견인(당김) 손상','동상','총상'],'혈관질환: 동맥경화증, 폐색성 혈전 혈관염, 레이노드 병. 외상: 압좌상, 견인 손상, 화상, 총상, 동상.');
Q('A',1,'L','합병증','3. 절단 합병증','절단된 사지가 아직 있다고 느끼는, 통증이 없는 감각은?',['환각지','환각통','신경종','국소통증','관절 구축'],'환각지: 절단된 사지가 아직 있다고 느끼는 통증 없는 감각. 환각통: 없어진 신체부위에 대한 통감.');
Q('A',1,'L','합병증','3. 절단 합병증','절단되고 없어진 신체부위에 대해 느끼는 통감은?',['환각통','환각지','신경종','궤양형성','관절 구축'],'환각통: 절단되고 없어진 신체부위에 대한 통감. 환각지는 통증이 없는 감각.');
Q('A',1,'L','합병증','3. 절단 합병증','절단 합병증 중 궤양형성의 원인으로 제시된 것은?',['잘 맞지 않는 의지 사용으로 인한 찰과상이나 압박','절단단의 탈감작 부족','근전동 의지의 전극 간섭','연성드레싱의 과도한 사용','K-level이 낮은 경우'],'궤양형성: 잘 맞지 않는 의지 사용으로 찰과상이나 압박에 의해 궤양 유발.');
Q('A',1,'L','상지절단','상지 절단 1) 수부(손) 절단','미트(mitt) 절단이란?',['손가락이 모두 절단된 경우','엄지손가락만 절단된 경우','손목관절에서 이단된 경우','노뼈와 자뼈를 분리한 경우','아래팔 80% 이상이 남은 경우'],'미트(mitt) 절단: 손가락이 모두 절단된 경우. 엄지 잔존 여부는 쥐는 동작에 영향.');
Q('A',1,'L','전완절단길이','상지 절단 2) 전완(아래팔) 절단','전완(아래팔) 절단에서 절단단 길이가 55%~35%인 경우는?',['단전완(짧은 아래팔) 절단','장전완(긴 아래팔) 절단','중전완(아래팔 중간) 절단','극단전완(매우 짧은 아래팔) 절단','미트 절단'],'장전완 80% 이상 / 중전완 80~55% / 단전완 55~35% / 극단전완 35% 이하.');
Q('A',1,'L','전완절단길이','상지 절단 2) 전완(아래팔) 절단','중전완(아래팔 중간) 절단의 길이 기준은?',['80% ~ 55%','80% 이상','55% ~ 35%','35% 이하','30% 이하'],'장전완 80% 이상 / 중전완 80~55% / 단전완 55~35% / 극단전완 35% 이하.');
Q('A',1,'L','전완절단길이','상지 절단 2) 전완(아래팔) 절단','극단전완(매우 짧은 아래팔) 절단의 길이 기준은?',['35% 이하','30% 이하','55% 이하','55% ~ 35%','80% ~ 55%'],'극단전완: 35% 이하. (30%는 상완골경 기준과 헷갈리기 쉬움)');
Q('A',1,'R','상완절단','3) 상완(위팔) 절단','상완(위팔) 절단에서 어깨 관절 이단과 동일하게 간주하는 경우는?',['길이가 상완골경(위팔뼈목) 30% 이하로 남은 경우','길이가 35% 이하로 남은 경우','길이가 55% 이하로 남은 경우','대전자로부터 5cm 미만인 경우','빗장뼈와 어깨뼈까지 절단된 경우'],'상완 절단(AE 절단): 길이가 상완골경 30% 이하로 남아있으면 어깨 관절 이단과 동일하게 간주.');
Q('A',1,'R','상완절단','3) 상완(위팔) 절단','AE 절단이 뜻하는 것은?',['상완(위팔) 절단','전완(아래팔) 절단','하퇴(종아리) 절단','대퇴(넓적다리) 절단','견(어깨)관절 이단'],'주관절 위에서 절단되었다고 하여 AE(above elbow) 절단 = 상완 절단. BE=아래팔, BK=하퇴, AK=대퇴.');
Q('A',1,'R','상완절단','5) 전사반부 절단','가장 근위 절단으로 빗장뼈와 어깨뼈까지 절단된 경우는?',['전사반부 절단','견(어깨)관절 이단','상완(위팔) 절단','골반 절단','하반신 절단'],'전사반부 절단: 가장 근위 절단, 빗장뼈와 어깨뼈까지 절단된 경우.');
Q('A',1,'R','족부절단','하지 절단 1) 족부(발) 절단 * Lisfranc','Lisfranc(리스프랑) 절단의 부위는?',['발목발허리관절','목말발배관절과 발꿈치입방관절','발목관절','발허리발가락관절','목말밑관절'],'Lisfranc 절단: 발목발허리관절에서 절단. 1~3번째 발허리뼈 기저부 이단, 4~5번째는 길이에 맞게 절단.');
Q('A',1,'R','족부절단','하지 절단 1) 족부(발) 절단 * Chopart','목말뼈와 발꿈치뼈만 남기고, 목말발배관절·발꿈치입방관절에서 이단하는 절단은?',['Chopart 절단','Lisfranc 절단','Pirogoff 절단','Boyd 절단','사임 절단'],'Chopart(쵸파르) 절단: 목말뼈와 발꿈치뼈만 남김. 목말발배관절, 발꿈치입방관절에서 이단.');
Q('A',1,'R','족부절단','하지 절단 1) 족부(발) 절단 * Chopart','Chopart 절단에 대한 설명으로 옳지 않은 것은?',['절단수술 시 가장 잘 선택되는 방법이다','발의 신전 기전이 상실되어 불균형이 발생한다','첨족(꿈치들린휜발) 변형이 되기 쉽다','목말뼈와 발꿈치뼈만 남긴다','목말발배관절, 발꿈치입방관절에서 이단한다'],'Chopart 절단은 신전 기전 상실로 불균형, 첨족 변형이 쉬워 「절단수술 시 잘 선택되는 방법이 아님」.');
Q('A',1,'R','족부절단','하지 절단 1) 족부(발) 절단 * Pirogoff','발꿈치뼈를 절제한 후 남아있는 종골(발꿈치뼈)의 끝부분과 경골(정강뼈) 먼쪽을 융합하는 절단은?',['Pirogoff 절단','Boyd 절단','Chopart 절단','Lisfranc 절단','Krukenberg 절단'],'Pirogoff(피로고프): 남은 종골 끝부분과 경골 먼쪽을 융합. 체중부하 가능, 다리 길이가 짧아져 의지발이 적용된 의지 사용.');
Q('A',1,'R','족부절단','하지 절단 1) 족부(발) 절단 * Boyd','종골(발꿈치뼈) 전체나 대부분을 보존하고 발목뼈를 제거한 후, 종골이 경골·비골의 원위부분에 고정되는 절단은?',['Boyd 절단','Pirogoff 절단','Chopart 절단','사임 절단','Lisfranc 절단'],'Boyd 절단: 종골 전체나 대부분 보존, 발목뼈 제거 후 종골이 경골과 비골의 원위부분에 고정. (Pirogoff는 종골을 절제하고 남은 끝부분을 융합)');
Q('A',1,'R','사임절단','2) 족(발목)관절 이단','사임 절단에 대한 설명으로 옳은 것은?',['발목관절에서 절단하며 체중 부하는 바로 할 수 있으나 외관이 투박하다','발목발허리관절에서 절단한다','체중 부하가 불가능하여 궁둥뼈 지지가 필요하다','외관은 좋으나 체중 부하를 할 수 없다','목말뼈와 발꿈치뼈만 남긴다'],'사임절단: 발목관절에서 절단. 발꿈치의 단단한 피부로 덮어 체중 부하는 바로 가능하나 외관이 투박함.');
Q('A',2,'L','하퇴대퇴절단','3) 하퇴(종아리) 절단','하퇴(종아리) 절단을 위한 최적의 길이로 제시된 것은?',['약 15cm','약 5cm','약 10cm','약 20cm','약 25cm'],'하퇴(BK) 절단 최적 길이 약 15cm.');
Q('A',2,'L','하퇴대퇴절단','4) 대퇴(넓적다리) 절단','대퇴(넓적다리) 절단에서 의지 부품을 적용하려면 절단 위치가 무릎관절 위로 약 얼마가 되어야 하는가?',['약 10cm','약 5cm','약 15cm','약 2.5cm','약 20cm'],'AK 절단: 무릎관절 위로 약 10cm 정도 되어야 의지 부품 적용 가능. (대전자로부터 5cm 이상은 소켓 착용 기준)');
Q('A',2,'L','하퇴대퇴절단','4) 대퇴(넓적다리) 절단','대퇴 절단에서 소켓 착용이 가능하려면 대전자(큰돌기)로부터 보존되어야 하는 길이는?',['5cm 이상','2.5cm 이상','10cm 이상','15cm 이상','20cm 이상'],'대전자(큰돌기)로부터 5cm 이상 길이가 보존되어야 소켓 착용 가능.');
Q('A',2,'L','골반하반신','5) 골반 절단','한쪽 골반을 포함한 다리 전체를 절단하며 「한쪽편골반절단」이라고도 하는 것은?',['골반 절단','하반신 절단','고관절 이단','전사반부 절단','대퇴 절단'],'골반 절단: 한쪽 골반을 포함한 다리 전체 절단, 한쪽편골반절단. 장골(엉덩뼈)의 일부 또는 전체가 소실.');
Q('A',2,'L','골반하반신','6) 하반신 절단','하반신 절단의 높이는 대체로 어디인가?',['L3~L4','L1~L2','T10~T12','L5~S1','S1~S2'],'하반신 절단: 엉덩뼈능선 뒤에서 시작, 서혜부 주름 높이에서 복부 밑을 지나 치골결합의 치골까지, 대체로 L3~L4 높이.');
Q('A',2,'L','특수절단','1. 특수한 기능을 위한 절단 1) Krukenberg','Krukenberg(크루켄버그) 절단에 대한 설명으로 옳은 것은?',['아래팔 절단에서 노뼈와 자뼈를 분리하는 수술로, 맹인이면서 양쪽 아래팔 절단인 경우 유용하다','정강이 부분을 180° 돌려 대퇴에 연결한다','종골과 경골 먼쪽을 융합한다','손가락을 모두 절단하는 수술이다','절단된 팔의 신경을 가슴 근육 신경과 연결한다'],'Krukenberg: 아래팔 절단에서 노뼈와 자뼈를 분리. 맹인이면서 양쪽 아래팔 절단에게 유용.');
Q('A',2,'L','특수절단','1. 특수한 기능을 위한 절단 2) 회전성형술','회전성형술에서 정강이 부분을 돌림시키는 각도는?',['180°','90°','45°','270°','360°'],'회전성형술: 무릎관절과 넓적다리뼈 원위를 절단하고 정강이 부분을 180° 돌려 남은 대퇴부위에 연결.');
Q('A',2,'L','특수절단','1. 특수한 기능을 위한 절단 2) 회전성형술','회전성형술을 적용하는 경우로 옳은 것은?',['무릎 주위의 악성종양으로 짧은 대퇴절단이나 고관절 이단이 되는 경우','당뇨로 인한 발 궤양','양쪽 아래팔 절단인 맹인','발목관절의 외상','소아의 선천적 손가락 기형'],'다리의 악성종양은 무릎 주위에서 주로 발생 → 짧은 대퇴절단이나 고관절 이단이 되므로 회전성형술 적용.');
Q('A',2,'L','특수절단','2. 소아기 절단','소아기 절단의 원칙으로 옳은 것은?',['가능한 절단단을 길게 남긴다','가능한 절단단을 짧게 남긴다','항상 관절 이단을 피한다','항상 개방성 절단으로 한다','의지는 성장이 끝난 후 착용한다'],'소아기 절단: 가능한 절단단을 길게 남겨야 함(뼈의 성장, 성장에 따른 의지 사용).');

/* ===== B. 절단 후 관리·처방 (2쪽 오른쪽 ~ 3쪽 왼쪽) ===== */
Q('B',2,'R','탈감작','절단단의 탈감작','절단단의 탈감작 방법으로 제시된 것은?',['문지르기·두드리기와 점진적인 체중부하','Unna 연고 붕대 적용','공기부목 적용','수술직후 의지(IPOP) 적용','탄력붕대 8자형 감기'],'탈감작: 치료적 마사지, 문지르기/두드리기, 마찰마사지, 점진적인 체중부하, 협조 운동.');
Q('B',2,'R','연성드레싱','2. 절단단의 수축 및 형성 1) 연성드레싱','연성드레싱에서 붕대를 감는 방법으로 옳은 것은?',['8자형으로 감으며 근위(몸쪽)보다 원위(먼쪽)를 더 압박한다','8자형으로 감으며 원위보다 근위를 더 압박한다','원형으로 감으며 전체를 균일하게 압박한다','나선형으로 감으며 근위를 더 압박한다','원형으로 감으며 근위만 압박한다'],'탄력붕대나 고무붕대를 8자형으로 감음. 근위(몸쪽)보다 원위(먼쪽) 부위를 더 압박. 부종 감소, 원추형태 형성.');
Q('B',2,'R','연성드레싱','2. 절단단의 수축 및 형성 1) 연성드레싱','연성드레싱의 단점이 아닌 것은?',['특별한 재료나 장비가 필요하다','붕대를 바꿀 때 통증이 있다','수축 형성이 늦다','상처 치유가 늦다','절단단 모양이 불규칙적이다'],'연성드레싱 장점: 원추형 유지, 상처 치유 관찰, 특별 재료·장비 필요 없음. 단점: 붕대 바꿀 때 통증, 수축형성·상처치유 늦음, 모양 불규칙.');
Q('B',2,'R','연성드레싱','2. 절단단의 수축 및 형성 1) 연성드레싱','shrinker의 착용 시간으로 옳은 것은?',['목욕이나 환기 시간을 제외하고 하루 종일','수면 시간에만','보행 훈련 시간에만','하루 최소 4시간씩 두 번','3~4시간 간격으로 풀고 밤에는 착용하지 않음'],'shrinker(탄력성): 목욕이나 환기를 위한 시간을 제외하고는 하루 종일 착용.');
Q('B',2,'R','드레싱종류','2) 반경성 드레싱','공기부목이나 Unna 연고 붕대를 이용해 절단단을 압박하는 드레싱은?',['반경성 드레싱','연성 드레싱','경성 드레싱','수술직후 의지','shrinker'],'반경성 드레싱: 공기부목, Unna 연고 붕대로 절단단 압박. 부종 예방, 상처 치유, 절단단 모양 형성.');
Q('B',2,'R','드레싱종류','3) 경성 드레싱','경성 드레싱의 효과로 옳지 않은 것은?',['상처 치유를 수시로 관찰하기 쉽다','종창(부기)과 부종을 감소시킨다','하퇴절단 후 슬관절 굴곡 구축 예방에 도움이 된다','환자의 불안감을 진정시킨다','조기보행을 가능하게 한다'],'경성 드레싱: 종창·부종 감소, 하퇴절단 후 슬관절 굴곡 구축 예방, 불안감 진정, 조기보행 가능. (상처 치유 관찰은 연성드레싱의 장점)');
Q('B',2,'R','드레싱종류','4) 수술직후 의지 (IPOP, IPSF)','수술직후 의지(IPOP)는 수술 후 언제 적용하는가?',['2주 이내','1주 이내','4주 이내','6주 이내','3개월 이내'],'수술직후 의지: 수술 후 2주 이내 적용. 부종 감소, 절단단 빠르게 성숙, 의지 제작 소요 시간 감소, 통증 및 환각통 감소.');
Q('B',2,'R','구축','관절가동범위와 근력의 유지','대퇴절단에서 발생하기 쉬운 고(엉덩)관절 구축은?',['굽힘, 벌림, 가쪽돌림','굽힘, 모음, 안쪽돌림','폄, 벌림, 가쪽돌림','폄, 모음, 안쪽돌림','굽힘, 모음, 가쪽돌림'],'대퇴절단: 고관절 굽힘, 벌림, 가쪽돌림 구축. (상완절단은 어깨 굽힘, 모음, 안쪽돌림)');
Q('B',2,'R','구축','관절가동범위와 근력의 유지','상완절단에서 발생하기 쉬운 어깨관절 구축은?',['굽힘, 모음, 안쪽돌림','굽힘, 벌림, 가쪽돌림','폄, 벌림, 가쪽돌림','폄, 모음, 안쪽돌림','굽힘, 벌림, 안쪽돌림'],'상완절단: 어깨관절 굽힘, 모음, 안쪽돌림 구축. (대퇴절단은 고관절 굽힘, 벌림, 가쪽돌림)');
Q('B',2,'R','구축','관절가동범위와 근력의 유지','절단 부위와 발생하기 쉬운 구축의 연결이 옳지 않은 것은?',['하퇴절단 – 슬관절 폄 구축','족관절 이단 – 첨족(꿈치들린휜발)','전완절단 – 팔꿈치관절 굴곡 구축','대퇴절단 – 고관절 굽힘·벌림·가쪽돌림','상완절단 – 어깨관절 굽힘·모음·안쪽돌림'],'하퇴절단은 슬관절 「굴곡」 구축.');
Q('B',2,'R','구축','관절가동범위와 근력의 유지','대퇴절단에서 절단에 의해 소실되는 근육은?',['큰모음근(대내전근)과 긴모음근(장내전근)','넙다리곧은근과 넙다리빗근','큰볼기근과 중간볼기근','엉덩허리근과 넙다리근막긴장근','넙다리뒤근과 장딴지근'],'대퇴절단: 고관절 폄근과 모음근이 손상. 큰모음근(대내전근)과 긴모음근(장내전근)이 절단에 의해 소실.');
Q('B',3,'L','위생환각통','1. 절단단의 피부 및 위생관리','절단단과 소켓의 위생관리로 옳은 것은?',['매일 밤 비누와 물로 씻고 절단단 양말도 매일 세탁하여 말린다','일주일에 한 번 알코올로 닦는다','매일 아침 착용 직전에 물로 씻는다','절단단 양말은 3일에 한 번 세탁한다','소켓은 씻지 않고 마른 수건으로만 닦는다'],'절단단과 소켓을 매일 밤 비누와 물로 씻고, 절단단 양말도 매일 세탁하여 말림.');
Q('B',3,'L','위생환각통','환각지 및 환각통의 원리','환각지·환각통에 대처하는 단계로 옳은 것은?',['증상이 실제이며 상상의 감각이 아니라는 것을 인정한다','증상이 상상의 감각임을 인식시킨다','의지 착용을 중단한다','절단단을 압박하지 않는다','증상을 무시하도록 교육한다'],'대처 단계: 증상이 실제이며 상상의 감각이 아니라는 것을 인정. 치료: 진통제, 침, 국소 캅사이신, 전기자극, 신경 차단제.');
Q('B',3,'L','처방고려','2. 의사 처방시 고려사항 1) 의학적 상태','하퇴절단에서 무릎 인대가 늘어나 있을 때 고려하는 현가장치는?',['관절융기위형 현가장치나 넓적다리 코르셋','실레지안 벨트','TES 벨트','8자형 하니스','흡입 현가장치'],'하퇴절단은 무릎관절 안정성이 중요. 인대가 늘어나 있으면 관절융기위형 현가장치나 넓적다리 코르셋 현가장치 고려.');
Q('B',3,'L','처방고려','2. 의사 처방시 고려사항 1) 의학적 상태','하퇴절단에서 의지 착용이 어렵다고 제시된 무릎 굽힘구축 각도는?',['25°','5°','10°','15°','35°'],'보행을 위해 최소한 35°의 굽힘이 필요하고, 25° 굽힘구축이 있으면 의지 착용이 어려움. (35°와 25° 헷갈림 주의)');
Q('B',3,'L','K-level','2) 활동수준 * K-level','K-level 중 「지역사회 내에서 제한적으로 걸을 수 있는」 수준은?',['K2','K0','K1','K3','K4'],'K0 걸을 수 없음 / K1 집안 내 / K2 지역사회 내 제한적 / K3 다양한 보행속도 / K4 활동적인 성인 운동선수.');
Q('B',3,'L','K-level','2) 활동수준 * K-level','K-level 중 「집안 내에서만 걸을 수 있는 사람」은?',['K1','K0','K2','K3','K4'],'K0 걸을 수 없음 / K1 집안 내에서만 / K2 지역사회 내 제한적 / K3 다양한 보행속도 / K4 운동선수.');
Q('B',3,'L','K-level','2) 활동수준 * K-level','에너지저장형 의지발을 처방하기 위한 K-level은?',['K3 수준 이상','K1 수준 이상','K2 수준 이상','K4 수준만','K0 수준 이상'],'K3 수준 이상이 되어야 에너지저장형 의지발 처방. (유연성 용골·다축 의지발은 적어도 K2)');
Q('B',3,'L','K-level','2) 활동수준 * K-level','유연성 용골을 가진 의지발이나 다축 의지발을 사용하려면 적어도 어느 수준이어야 하는가?',['K2','K0','K1','K3','K4'],'유연성 용골 의지발·다축 의지발: 적어도 K2. 에너지저장형: K3 이상.');
Q('B',3,'L','골격식','외골격식 의지 / 2. 내골격식 의지','외골격식 의지에 대한 설명으로 옳은 것은?',['주로 나무로 제작되고 가벼우나 의지 재정렬이나 조절이 어렵다','내부가 금속 튜브 구조이다','외부를 부드러운 폼으로 감싼다','재정렬과 조절이 쉽다','체중이 전달될 때 강도는 내부 구조에 좌우된다'],'외골격식: 주로 나무, 내부는 비어 있어 강도는 외부 구조에 좌우. 가볍지만 재정렬·조절 어려움. 내골격식: 외부 폼 + 내부 금속 튜브.');

/* ===== C. 팔 의지 (3쪽 오른쪽 ~ 8쪽) ===== */
Q('C',3,'R','근전동','근전동 의지 1) 전극','근전동 의지의 전극에 대한 설명으로 옳은 것은?',['내부에 증폭기가 내장되어 근수축으로 생성되는 활동전위를 감지한다','배터리의 전력을 모터로 전달한다','케이블의 장력을 감지한다','말단장치를 직접 여닫는 모터이다','하니스의 장력을 조절한다'],'전극: 인체와 의지를 연결하는 접촉면. 내부에 증폭기가 내장되어 근수축에 의해 생성되는 활동전위를 감지.');
Q('C',3,'R','근전동','근전동 의지 2) 제어장치','근전도 신호에 정비례하여 말단장치나 팔꿈치관절장치의 속도와 힘을 조절하는 제어 방식은?',['비례제어 방식','개폐(on-off) 제어 방식','수의적 개방식','수의적 폐쇄식','마찰하중식'],'비례제어 방식: 근전도 신호에 정비례하여 말단장치나 팔꿈치관절장치의 움직임에서 속도, 힘 조절.');
Q('C',3,'R','근전동전극','근전동 의지 3) 근전동 의지 작동 기전','근전동 의지 작동을 위해 일반적으로 사용하는 전극의 수는?',['2개','1개','3개','4개','5개'],'근전동 의지 작동을 위해 전극은 일반적으로 2개 사용.');
Q('C',3,'R','근전동전극','근전동 의지 3) 근전동 의지 작동 기전','위팔의지에서 근전동 전극을 위치시키는 근육은?',['팔꿈치관절 굽힘근과 폄근','손목관절 굽힘근과 폄근','어깨세모근과 큰가슴근','어깨뼈 벌림근과 모음근','손가락 굽힘근과 폄근'],'손목관절이단·아래팔의지: 손목관절 굽힘근과 폄근 / 위팔의지: 팔꿈치관절 굽힘근과 폄근.');
Q('C',3,'R','근전동전극','근전동 의지 3) 근전동 의지 작동 기전','근전동 전극의 배치로 옳은 것은?',['근섬유 방향으로 접촉시키고 전극끼리는 서로 멀리 떨어뜨린다','근섬유와 직각으로 접촉시키고 전극끼리 가깝게 둔다','근섬유 방향으로 접촉시키고 전극끼리 가깝게 둔다','근섬유와 직각으로 접촉시키고 전극끼리 멀리 둔다','뼈 융기 부위에 붙인다'],'전극은 근섬유 방향으로 접촉이 좋고, 간섭을 최소화하기 위해 서로 멀리 떨어져 있는 게 좋음.');
Q('C',3,'R','근전동','근전동 의지 3) 표적 근육 신경재분포술(TMR)','절단된 팔에 남아 있는 신경을 가슴 등 신체의 다른 근육의 신경과 연결시키는 방법은?',['표적 근육 신경재분포술(TMR)','Krukenberg 절단','회전성형술','근성형 절단술','힘줄 고정 동작(tenodesis action)'],'TMR: 절단된 팔에 남아 있는 신경을 가슴 등 신체의 다른 근육의 신경과 연결.');
Q('C',3,'R','근전동특징','근전동 의지 4) 근전동 의지 특징','근전동 의지의 특징으로 옳지 않은 것은?',['케이블을 사용하므로 외관이 떨어진다','하니스 같은 현가장치를 사용하지 않아 불편함이 감소한다','현가장치가 없어 오히려 무겁다고 느낀다','더 넓은 범위에서 기능적으로 사용할 수 있다','케이블 의수보다 더 큰 힘의 잡기가 가능하다'],'근전동 의지는 케이블을 사용하지 않아 외관 개선, 수용성 증가.');
Q('C',3,'R','근전동특징','근전동 의지 4) 근전동 의지 특징','근전동 의지에서 가능한 잡기의 힘은?',['5~12kg','0.9~1.3kg','1~3kg','15~20kg','20~30kg'],'케이블을 사용하는 의수에 비해 더 큰 힘의 잡기(5~12kg) 가능.');
Q('C',3,'R','근전동','2. 혼합형 의지','혼합형 의지의 구성으로 옳은 것은?',['신체구동식 팔꿈치관절장치 + 근전동 말단장치 및 손목장치','근전동 팔꿈치관절장치 + 신체구동식 말단장치','신체구동식 말단장치 + 수동 손목장치','근전동 팔꿈치관절장치 + 근전동 말단장치','수동 팔꿈치관절장치 + 미관용 글러브'],'혼합형 의지: 신체구동식 팔꿈치관절장치와 근전동 말단장치 및 손목장치로 구성. 주로 위팔 절단 이상에서 사용.');
Q('C',3,'R','손의지','수지(손가락) 및 수부(손) 의지','건측 손을 과다하게 사용해 생기며, 양손 사용과 적절한 잡기 유형을 통해 경감되는 것은?',['반대측 과사용 증후군','환각통','신경종','볼크만 허혈성 구축','구획증후군'],'잡기 유형은 건측 손을 과다하게 사용하는 반대측 과사용 증후군과 관련. 양손 사용과 적절한 잡기 유형으로 경감.');
Q('C',4,'L','손의지','2. 수부(손) 의지 1) 수동 손 의지','수동 손 의지에 대한 설명으로 옳은 것은?',['주로 PVC나 실리콘으로 제작해 외관이 뛰어나지만 능동적인 움직임은 제공하지 않는다','손목관절의 움직임으로 잡기를 제공한다','근전도 신호로 다섯 손가락이 움직인다','케이블을 당기면 손가락이 열린다','힘줄 고정 동작 원리를 적용한다'],'수동 손 의지: PVC·실리콘 → 뛰어난 외관. 능동적 움직임 X, 물건 고정/밀기 등에 사용.');
Q('C',4,'L','손의지','2. 수부(손) 의지 2) 신체 구동식 손 의지','신체 구동식 손 의지에서 잡기 동작을 위해 적용하는 원리는?',['힘줄 고정 동작(tenodesis action)','삼점압 원리','비례제어','bony lock','신연의 원리'],'신체 구동식 손 의지: 손목관절의 움직임으로 잡기·집기 제공, 힘줄 고정 동작(tenodesis action) 원리 적용.');
Q('C',4,'L','손목이단의지','손목관절 이단 의지 1) 소켓','손목관절 이단 의지 소켓에 대한 설명으로 옳은 것은?',['먼쪽이 납작한 타원형이며 전면은 아래팔의 1/2만 포함하고 후면은 팔꿈치머리 주위까지 감싼다','먼쪽이 원형이며 전면과 후면 모두 팔꿈치머리까지 감싼다','전면은 팔꿈치머리까지, 후면은 아래팔의 1/2만 포함한다','팔꿈치 관절과 위팔뼈 관절융기를 완전히 감싼다','2개의 소켓을 스텝-업 힌지로 연결한다'],'먼쪽이 납작한 타원형. 전면은 아래팔의 1/2만 포함, 후면은 물건을 올릴 때 하방 저항을 주도록 팔꿈치머리 주위까지 감쌈.');
Q('C',4,'L','손목이단의지','손목관절 이단 의지 2) 구성품','손목관절 이단 의지에서 팔꿈치관절장치를 잘 사용하지 않는 이유는?',['아래팔 절단에 비해 회외/회내가 가능하기 때문','절단단이 짧기 때문','근전동 의수를 쓸 수 없기 때문','하니스가 필요 없기 때문','소켓이 팔꿈치를 완전히 감싸기 때문'],'손목관절이단은 아래팔 절단에 비해 회외/회내가 가능하므로 팔꿈치관절장치를 잘 사용하지 않음.');
Q('C',4,'L','아래팔의수','아래팔 의지 1) 수동 의수','미트(mitt) 의수의 적용 대상으로 옳은 것은?',['소아와 스포츠 활동, 유아에게 최초로 적용','성인 남성의 작업용','양측 팔 절단 성인','위팔두갈래근 근성형 절단술을 받은 사람','맹인이면서 양쪽 아래팔 절단인 사람'],'미트: 소아와 스포츠활동에 사용. 유아에게 최초로 적용되어 똑바로 앉기, 기기, 걷기, 양손기술 학습에 추천.');
Q('C',4,'L','VO-VC','아래팔 의지 2) 기능적 의수','수의적 개방식(VO)에 대한 설명으로 옳은 것은?',['평소에는 닫혀 있고 조절 케이블을 당기면 열린다','평소에는 열려 있고 힘을 주면 닫힌다','힘을 빼면 열린다','근전도 신호로 열린다','한 번 잡으면 자동으로 잠긴다'],'VO: 조절 케이블을 당기면 열림, 평소에는 닫혀 있음. VC: 평소 열려 있다가 힘을 주면 닫히고 힘을 빼면 열림.');
Q('C',4,'L','VO-VC','아래팔 의지 2) 기능적 의수','수의적 폐쇄식(VC)에 대한 설명으로 옳은 것은?',['평소에는 열려 있다가 힘을 주면 닫히고 힘을 빼면 열린다','평소에는 닫혀 있다가 케이블을 당기면 열린다','고무밴드의 힘으로 닫힌다','항상 닫힌 상태로 고정된다','힘을 빼면 닫힌다'],'VC: 평소에는 열려 있다가 힘을 주면 닫히고, 힘을 빼면 열림.');
Q('C',4,'R','Hosmer후크','(1) 수의적 개방식 후크 - Hosmer','Hosmer 수의적 개방식 후크 중 성인용 시리즈는?',['5번 시리즈','7번 시리즈','8번 시리즈','9번 시리즈','10번 시리즈'],'성인용 5번 / 작업용 7번 / 여성용 8번 / 청소년용 9번 / 아동용 10번 / 유아용 12번.');
Q('C',4,'R','Hosmer후크','(1) 수의적 개방식 후크 - Hosmer','Hosmer 후크 중 스테인리스 재질의 작업용 후크 시리즈는?',['7번 시리즈','5번 시리즈','8번 시리즈','9번 시리즈','12번 시리즈'],'작업용 후크: 7번 시리즈, 스테인리스 재질.');
Q('C',4,'R','Hosmer후크','(1) 수의적 개방식 후크 - Hosmer','Hosmer 후크 시리즈와 대상의 연결이 옳은 것은?',['여성용 – 8번, 청소년용 – 9번, 아동용 – 10번, 유아용 – 12번','여성용 – 9번, 청소년용 – 8번, 아동용 – 10번, 유아용 – 12번','여성용 – 8번, 청소년용 – 10번, 아동용 – 9번, 유아용 – 12번','여성용 – 7번, 청소년용 – 9번, 아동용 – 10번, 유아용 – 12번','여성용 – 8번, 청소년용 – 9번, 아동용 – 12번, 유아용 – 10번'],'성인 5 / 작업용 7 / 여성 8 / 청소년 9 / 아동 10 / 유아 12.');
Q('C',4,'R','Hosmer후크','(1) 수의적 개방식 후크 - Hosmer','Hosmer 후크 등급과 재질의 연결이 옳은 것은?',['X등급 – 네오프렌 같은 합성고무, A등급 – 알루미늄 합금, P등급 – 플라스티졸','X등급 – 알루미늄 합금, A등급 – 합성고무, P등급 – 플라스티졸','X등급 – 플라스티졸, A등급 – 알루미늄 합금, P등급 – 합성고무','X등급 – 스테인리스, A등급 – 알루미늄 합금, P등급 – PVC','X등급 – 합성고무, A등급 – 스테인리스, P등급 – 플라스티졸'],'X등급: 후크 손가락 부분 네오프렌 같은 합성고무 / A등급: 알루미늄 합금 / P등급: 플라스티졸.');
Q('C',4,'R','VC후크','(2) 수의적 폐쇄식 후크','수의적 폐쇄식 후크의 대표적인 말단장치는?',['TRS 후크, APRL 후크','Hosmer 5번, 7번 후크','Becker Plylite, Lock-Grip','Robin-Aids, Sierra VO','Greissinger, SACH'],'VC 후크 대표: TRS 후크, APRL 후크. 아동, 스포츠를 즐기는 경우, 길이가 긴 편측 아래팔 절단장애인에게 적합.');
Q('C',4,'R','VC후크','(2) 수의적 폐쇄식 후크','위팔두갈래근의 근성형 절단술을 받은 사람이 신체의 힘을 이용할 수 있도록 개발된 후크는?',['APRL 후크','TRS 후크','Hosmer 5X 후크','Hosmer 7번 후크','Sierra VO'],'APRL 후크: 위팔두갈래근의 근성형 절단술을 받은 사람에게 신체의 힘을 이용할 수 있도록 개발.');
Q('C',4,'R','VC후크','(2) 수의적 폐쇄식 후크','TRS 후크의 특징으로 옳은 것은?',['대운동의 원통형 잡기를 위한 표면이 있고 손가락 끝으로 소운동의 집기도 가능하다','한 번 잡으면 자동으로 잠긴다','엄지손가락만 움직인다','저밀도 우레탄 폼으로 덮여 있다','Bag Loc이라는 특징이 있다'],'TRS 후크: 대운동의 다양한 원통형 잡기를 위한 표면 + 손가락 끝을 사용한 소운동 집기 가능.');
Q('C',4,'R','핸드','(3) 수의적 폐쇄식 핸드','APRL 핸드의 특징으로 옳은 것은?',['주로 성인 남성에게 사용하며 한 번 잡기 동작이 되면 자동으로 잠긴다','주로 아동에게 사용한다','엄지손가락만 움직여 7.5cm 물건까지 쥔다','다섯 손가락을 모두 개방시킨다','중립자세에서 엄지 개방이 크다'],'APRL 핸드(VC): 주로 성인 남성, 한 번 잡기 동작이 되고 자동으로 잠김. 중립자세에서 엄지 개방이 작음.');
Q('C',4,'R','핸드','(4) 수의적 개방식 핸드','엄지손가락만 움직일 수 있고 7.5cm의 물건까지 쥘 수 있는 핸드는?',['Becker Plylite hand','Becker Lock-Grip hand','Robin-Aids mechanical hand','Sierra VO hand','APRL hand'],'Becker, Plylite hand: 엄지 손가락만 움직일 수 있고 7.5cm 물건까지 쥘 수 있음.');
Q('C',4,'R','핸드','(4) 수의적 개방식 핸드','Robin-Aids mechanical hand가 아래팔 절단이나 손목관절 이단에 적합한 이유는?',['핸드의 길이가 매우 짧기 때문','무게가 가장 가볍기 때문','다섯 손가락이 모두 움직이기 때문','우레탄 폼으로 덮여 부드럽기 때문','자동 잠김 기능이 있기 때문'],'Hosmer, Robin-Aids mechanical hand: 고정된 엄지 + 움직이는 네 손가락. 핸드 길이가 매우 짧아 아래팔 절단이나 손목관절 이단에 적합.');
Q('C',4,'R','핸드','(4) 수의적 개방식 핸드','「Bag Loc」이라는 특징이 있어 모든 손가락 자세에서 작동하며 무거운 물건을 안전하게 잡게 하는 핸드는?',['Hosmer Sierra VO hand','Hosmer Robin-Aids soft mechanical hand','Becker Imperial hand','Becker Plylite hand','APRL hand'],'Hosmer, Sierra VO hand: Bag Loc 특징, 모든 손가락 자세에서 작동, 무거운 물건을 안전하게 잡음.');
Q('C',4,'R','핸드','(4) 수의적 개방식 핸드','케이블 장력이 엄지·집게·가운데 손가락을 움직여 개방하고 저밀도 우레탄 폼으로 덮여 부드러운 핸드는?',['Hosmer Robin-Aids soft mechanical hand','Hosmer Robin-Aids mechanical hand','Hosmer Sierra VO hand','Becker Lock-Grip hand','Becker Plylite hand'],'Robin-Aids soft mechanical hand: 엄지, 집게, 가운데 손가락 개방. 저밀도 우레탄 폼으로 부드러움.');
Q('C',5,'L','손목장치','2. 손목장치 1) 마찰식','두께가 얇아서 손목관절 이단에 적합한 손목장치는?',['마찰식 손목장치','빠른 착탈식 손목장치','굴곡형 손목장치','돌림형 손목장치','볼-소켓 손목장치'],'마찰식 손목장치: 고무재질 와셔, 말단장치를 조임에 따라 마찰력 제공. 두께가 얇아 손목관절 이단에 적합.');
Q('C',5,'L','손목장치','2. 손목장치 2) 지속적 마찰식','나삿니 부분에 나일론 나삿니를 추가로 삽입해 말단장치를 돌리는 내내 마찰력을 제공하는 손목장치는?',['지속적 마찰식 손목장치','마찰식 손목장치','빠른 착탈식 손목장치','돌림형 손목장치','굽힘/돌림형 손목장치'],'지속적 마찰식: 나일론 나삿니 부분을 추가로 삽입 → 말단장치를 돌리는 내내 마찰력 제공.');
Q('C',5,'L','손목장치','2. 손목장치 3) 빠른 착탈식','빠른 착탈식 손목장치에서 버튼 역할을 하는 부품은?',['yoke','와셔','리테이너','크로스바 어셈블리','베이스 플레이트'],'빠른 착탈식: 두 개 이상의 의수와 호환되는 어댑터 내장. 어댑터에 버튼 역할을 하는 yoke와 스프링 및 기어가 있어 의수를 고정·방출.');
Q('C',5,'L','손목장치각도','2. 손목장치 4) 굴곡형','굴곡형 손목장치에서 의수를 수동 조절할 수 있는 위치는?',['중립, 30° 굴곡, 50° 굴곡','중립, 25° 굴곡, 50° 굴곡','중립, 15° 굴곡, 30° 굴곡','중립, 30° 굴곡, 60° 굴곡','중립, 45° 굴곡, 90° 굴곡'],'굴곡형: 중립, 30°, 50° 굴곡 (양측 팔 절단에 매우 유용). 굽힘/돌림형은 중립, 25°, 50°. 헷갈림 주의.');
Q('C',5,'L','손목장치각도','2. 손목장치 6) 굽힘/돌림형','굽힘/돌림형 손목장치에서 굽힘이 가능한 위치는?',['중립, 25°, 50°','중립, 30°, 50°','중립, 15°, 35°','중립, 30°, 60°','중립, 45°, 90°'],'굽힘/돌림형: 중립, 25°, 50° 굽힘 + 360° 돌림. (굴곡형은 중립, 30°, 50°)');
Q('C',5,'L','손목장치각도','2. 손목장치 5) 돌림형','돌림형 손목장치는 360° 돌림 중 몇 가지 위치에서 잠금 상태가 되는가?',['18가지','7가지','12가지','32가지','36가지'],'돌림형: 360° 돌림, 18가지 위치에서 잠금. (외부 잠금식 팔꿈치 7가지, 잠금형 어깨관절장치 32가지와 구분)');
Q('C',5,'L','손목장치','2. 손목장치 4) 굴곡형','양측 팔 절단의 경우 매우 유용하게 사용하는 손목장치는?',['굴곡형 손목장치','마찰식 손목장치','지속적 마찰식 손목장치','빠른 착탈식 손목장치','볼-소켓 손목장치'],'굴곡형 손목장치: 양측 팔 절단에 매우 유용. 중립, 30°, 50° 굴곡.');
Q('C',5,'L','손목장치','2. 손목장치 7) 볼-소켓','내골격식 의지에 사용되는 손목장치는?',['볼-소켓 손목장치','마찰식 손목장치','돌림형 손목장치','굴곡형 손목장치','빠른 착탈식 손목장치'],'볼-소켓 손목장치: 내골격식 의지에 사용.');
Q('C',5,'R','아래팔소켓','3. 소켓 2) 분리형 소켓','2:1 효율의 스텝-업 힌지를 사용할 때 팔꿈치관절을 30° 굽힘하면 의지는 몇 도 굽힘되는가?',['60°','15°','30°','45°','90°'],'분리형 소켓(매우 짧은 절단단): 스텝-업 힌지 2:1 → 팔꿈치 30° 굽힘 시 의지 60° 굽힘(2배).');
Q('C',5,'R','아래팔소켓','3. 소켓 3) 뮌스터 소켓','뮌스터 소켓에 대한 설명으로 옳은 것은?',['매우 짧은 아래팔 절단에 적용하며 팔꿈치머리돌기와 위팔뼈 관절융기에서 현가기능을 가진다','중간 길이의 절단단을 위한 소켓이다','손바닥쪽에서 높이가 낮아진다','2개의 소켓을 스텝-업 힌지로 연결한다','전면은 아래팔의 1/2만 포함한다'],'뮌스터: 매우 짧은 아래팔 절단. 팔꿈치 관절과 위팔뼈 관절융기를 완전히 감싸 팔꿈치머리돌기와 위팔뼈 관절융기에서 현가.');
Q('C',5,'R','아래팔소켓','3. 소켓 4) 노스웨스턴 소켓','노스웨스턴 소켓이 뮌스터 소켓과 다른 점은?',['손바닥쪽에서 높이가 낮아진다','팔꿈치머리를 포함하지 않는다','스텝-업 힌지를 사용한다','하니스가 반드시 필요하다','매우 짧은 절단단에만 쓴다'],'노스웨스턴: 중간 길이 절단단용. 뮌스터와 다르게 손바닥쪽에서 높이가 낮아짐을 제외하고 나머지는 동일.');
Q('C',5,'R','아래팔소켓','3. 소켓 1) 재래식 소켓','아래팔 의지의 재래식 소켓에서 지켜야 할 점은?',['위팔두갈래근의 건(힘줄)이 압박되지 않고 뒤에서는 팔꿈치머리가 포함되어야 한다','위팔뼈 관절융기를 완전히 감싸야 한다','팔꿈치머리 부분을 잘라내야 한다','전면이 팔꿈치머리까지 올라와야 한다','위팔세갈래근 힘줄을 압박해야 한다'],'재래식 소켓: 위팔두갈래근의 건(힘줄)이 압박되지 않아야 하고, 뒤에서는 팔꿈치머리가 포함되어야 함.');
Q('C',5,'R','조절케이블','4. 동력 전달장치 1) 조절케이블','아래팔 의지의 조절 케이블 하우징이 세갈래근 패드에서 고정되는 부품은?',['크로스바 어셈블리','베이스 플레이트와 리테이너','yoke','elbow flexion attachment','턴버클'],'세갈래근 패드: 크로스바 어셈블리로 하우징 고정 / 아래팔 소켓 중간: 베이스 플레이트와 리테이너로 고정.');
Q('C',5,'R','조절케이블','4. 동력 전달장치 1) 조절케이블','아래팔 소켓의 중간에서 조절 케이블 하우징을 고정하는 부품은?',['베이스 플레이트와 리테이너','크로스바 어셈블리','yoke와 스프링','스텝-업 힌지','행거와 링'],'아래팔 소켓의 중간에서 베이스 플레이트와 리테이너에 의해 고정. (세갈래근 패드에서는 크로스바 어셈블리)');
Q('C',5,'R','8자하니스','5. 현가장치 (1) 아래팔 의지 표준형 하니스','아래팔 의지 표준형(8자형) 하니스에 사용하는 스트랩의 폭은?',['2.5cm','1cm','1.3cm','4cm','5cm'],'8자형 하니스: 폭 2.5cm의 나일론 스트랩이나 데이크론 웨빙 사용.');
Q('C',5,'R','8자하니스','5. 현가장치 A. 액와(겨드랑) 루프','8자형 하니스의 액와(겨드랑) 루프에 대한 설명으로 옳은 것은?',['하니스의 주된 고정부분으로 건측 견갑대를 둘러싼다','절단측 어깨를 둘러싼다','조절 케이블의 근위부와 직접 연결된다','내의 안쪽 맨살에 착용한다','세갈래근 패드와 연결된다'],'액와 루프: 하니스의 주된 고정부분, 건측 견갑대를 둘러쌈. 패드를 적용하고 내의 바깥쪽에 착용.');
Q('C',6,'L','8자하니스','B. 전방(앞) 지지 스트랩','8자형 하니스에서 전방(앞) 지지 스트랩의 주된 기능은?',['의지가 무거운 하중에 노출되었을 때 절단단에서 소켓의 위치가 바뀌지 않게 한다','조절 케이블을 당겨 말단장치를 작동시킨다','건측 견갑대를 고정한다','팔꿈치관절장치를 잠근다','소켓이 바깥돌림되는 것을 막는다'],'전방 지지 스트랩: 세갈래근패드의 거꾸로 된 Y형 끈과 연결. 무거운 하중에서 소켓 위치가 바뀌지 않도록 함.');
Q('C',6,'L','8자하니스','C. 조절 부착 스트랩','8자형 하니스에서 조절 부착 스트랩이 통과하는 위치는?',['절단측 견갑골 극(어깨뼈 가시)과 하각(아래구석) 사이','건측 어깨뼈 가시 위','C7 극돌기 위','절단측 빗장뼈 위','건측 겨드랑 아래'],'조절 부착 스트랩: 액와 루프 윗부분에서 시작하여 절단측 견갑골 극과 하각 사이를 통과, 조절 케이블 근위부와 연결.');
Q('C',6,'L','8자하니스','D. 후방(뒤) 교차점','8자형 하니스에서 후방(뒤) 교차점의 위치는?',['C7 극(가시)돌기 아래에서 약간 건측','C7 극돌기 위에서 약간 절단측','T7 극돌기 정중앙','C7 극돌기 아래에서 약간 절단측','건측 어깨뼈 아래구석'],'후방 교차점: C7 극돌기 아래에서 약간 건측. 재봉 또는 금속 원형 고리(ring)로 연결.');
Q('C',6,'L','하니스작동','- 하니스 작동원리','아래팔 의지에서 말단장치를 작동시키기 위한 기본 신체 움직임은?',['어깨관절 굽힘','어깨관절 폄','어깨관절 올림(거상)','팔꿈치관절 폄','몸통 돌림'],'아래팔 의지: 말단장치 작동을 위해 어깨관절을 굽힘. 신체 중앙부(단추 끼우기)나 고정된 위치에서는 양쪽 어깨뼈 벌림 이용.');
Q('C',6,'L','하니스작동','- 하니스 작동원리','옷의 단추를 끼울 때처럼 신체 중앙부에서 말단장치를 사용할 때 이용하는 움직임은?',['양쪽 어깨뼈 벌림','양쪽 어깨뼈 모음','절단측 어깨관절 폄','건측 어깨관절 굽힘','절단측 어깨관절 올림'],'신체의 중앙부에서 말단장치를 사용하거나 고정된 위치에서 사용해야 하는 경우 양쪽 어깨뼈 벌림을 이용.');
Q('C',6,'L','하니스종류','(2) 어깨 안장 하니스','어깨 안장 하니스를 사용하는 이유로 옳은 것은?',['표준 8자형 하니스가 건측 겨드랑에 주는 과한 압박을 절단측 어깨로 분배하기 위해','말단장치 작동 범위를 2배로 늘리기 위해','자체 현가 소켓에서 말단장치만 작동시키기 위해','양쪽 절단에서 겨드랑 루프를 없애기 위해','팔꿈치관절 잠금을 조절하기 위해'],'8자형은 장시간 사용 시 겨드랑에 과한 압박, 심하면 위팔신경얼기 압박. 어깨 안장 하니스는 절단측 어깨 위 패드로 장력을 분배.');
Q('C',6,'L','하니스종류','(3) 9자형 하니스','9자형 하니스에 대한 설명으로 옳은 것은?',['뮌스터 소켓처럼 자체 현가기능이 있는 소켓에서 말단장치 작동을 위해 사용한다','전방 지지 스트랩과 가슴 스트랩으로 구성된다','양쪽 아래팔 의지에 사용한다','겨드랑 루프가 없다','절단측 어깨 위에 안장 패드를 적용한다'],'9자형: 자체 현가기능이 있는 뮌스터 소켓이나 라이너 적용 소켓에서 말단장치 작동용. 건측 겨드랑루프 + 조절 부착 스트랩으로 구성.');
Q('C',6,'R','하니스종류','(4) 양쪽 아래팔 의지를 위한 하네스','양쪽 아래팔 의지를 위한 하네스의 특징은?',['겨드랑 루프가 없고 한쪽 조절부착 스트랩이 반대쪽 앞지지 스트랩과 연결된다','겨드랑 루프가 양쪽에 2개 있다','등교차 스트랩과 어깨 위 스트랩이 필수이다','가슴 스트랩으로만 고정한다','조절부착 스트랩끼리 서로 연결된다'],'겨드랑 루프가 없고, 오른쪽 조절부착 스트랩 ↔ 왼쪽 앞지지 스트랩, 왼쪽 조절부착 스트랩 ↔ 오른쪽 앞지지 스트랩 연결.');
Q('C',6,'R','근전동현가','2) 근전동 의지를 위한 현가장치','근전동 의지 현가에서 긴 아래팔 절단이나 손목관절 이단에 사용하는 잠금장치는?',['죔줄 잠금장치','핀 라이너와 셔틀락','실레지안 벨트','관절융기위 커프','yoke'],'절단단이 짧거나 중간 길이: 핀 라이너와 셔틀락 / 긴 아래팔 절단·손목관절 이단: 죔줄 잠금장치.');
Q('C',6,'R','근전동현가','2) 근전동 의지를 위한 현가장치 1) 과상융기위 브림','긴 아래팔 절단 및 손목관절 이단을 위한 브림 현가장치는?',['플로팅 브림 현가장치','수정된 과상 브림 현가장치','PTB-SC','뮌스터 브림','캐나다식 브림'],'긴 절단단: 팔꿈치머리 부분을 잘라낸 수정된 과상 브림 / 긴 아래팔 절단 및 손목관절 이단: 플로팅 브림 현가장치.');
Q('C',6,'R','팔꿈치힌지','6. 주(팔꿈치) 관절 장치 1) 유연성 힌지','유연성 힌지는 절단단이 돌림되는 것의 약 몇 %를 전달하는가?',['약 50%','약 10%','약 25%','약 75%','약 100%'],'유연성 힌지: 몸쪽부는 세갈래근 패드, 먼쪽부는 소켓에 부착. 절단단 돌림의 약 50% 전달.');
Q('C',6,'R','팔꿈치힌지','6. 주(팔꿈치) 관절 장치 2) 경성 힌지','조직이 뭉쳐지는 것을 감소시켜 팔꿈치 관절 굽힘을 증가시키는 데 도움이 되는 힌지는?',['다축 힌지','단축 힌지','유연성 힌지','스텝-업 힌지','절단단 구동 잠금식 힌지'],'다축 힌지: 조직이 뭉쳐지는 것을 감소시켜 팔꿈치 관절 굽힘 증가에 도움. 단축 힌지: 과다폄을 막아줌.');
Q('C',6,'R','팔꿈치힌지','6. 주(팔꿈치) 관절 장치 (3) 스텝-업 힌지','스텝-업 힌지에 대한 설명으로 옳은 것은?',['매우 짧은 아래팔 절단단에 분리형 소켓과 함께 사용하며 움직임을 2배로 증폭한다','긴 절단단에 사용하며 돌림의 50%를 전달한다','과다폄을 막아준다','절단단으로 잠금과 풀림을 조작한다','7가지 각도에서 잠긴다'],'스텝-업 힌지: 매우 짧은 아래팔 절단단, 분리형 소켓에 사용, 사용자의 움직임을 2배로 증폭.');
Q('C',6,'R','팔꿈치이단','1. 팔꿈치관절 이단 의지','팔꿈치관절 이단 의지에 적용 가능한 팔꿈치관절장치는?',['소켓의 바깥에 적용되는 측면 잠금식 힌지','내부 잠금식 팔꿈치관절장치','유연성 힌지','스텝-업 힌지','볼-소켓 관절장치'],'팔꿈치관절 이단: 아래팔 의지와 달리 팔꿈치관절장치를 꼭 포함. 소켓 바깥에 적용되는 측면 잠금식 힌지 같은 관절장치만 적용 가능.');
Q('C',7,'L','위팔소켓','위팔 의지 1) 유타 동적 소켓','유타 동적 소켓에 대한 설명으로 옳지 않은 것은?',['반대측 겨드랑부의 부담이 증가한다','안가쪽 안정성을 제공하기 위해 디자인되었다','앞뒤로 날개처럼 형성되어 돌림을 조절한다','위팔뼈의 거친면이 노출되는 형태이다','고유감각과 근전도 유지성이 개선된다'],'유타 동적 소켓: 반대측 겨드랑부 부담과 위팔신경얼기에 대한 위험요소가 「감소」.');
Q('C',7,'L','위팔팔꿈치','2. 팔꿈치관절장치 (1) 외부 잠금식','외부 잠금식 팔꿈치관절장치에서 잠금과 풀림이 가능한 각도의 수는?',['7가지','5가지','11가지','18가지','32가지'],'외부 잠금식: 긴 절단단에 필요한 측면 관절 형태. 7가지 각도에서 잠금·풀림. (돌림형 손목 18, 잠금형 어깨 32)');
Q('C',7,'L','위팔팔꿈치','2. 팔꿈치관절장치 (2) 내부 잠금식','내부 잠금식 팔꿈치관절장치의 특징은?',['회전판이 포함되어 수동으로 아래팔부의 바깥돌림과 안쪽돌림이 가능하다','긴 절단단에만 사용하는 측면 관절 형태이다','7가지 각도에서만 잠긴다','절단단의 움직임을 2배로 증폭한다','턱으로 잠금을 조절한다'],'내부 잠금식: 다양한 각도에서 잠금 + 회전판으로 아래팔부 바깥돌림·안쪽돌림 수동 가능.');
Q('C',7,'L','위팔케이블','3. 조절케이블','위팔 의지에서 사용하는 조절케이블의 수와 역할로 옳은 것은?',['2개 – 팔꿈치 굽힘/말단장치 작동용, 팔꿈치 잠금/풀림용','1개 – 말단장치 작동용','2개 – 손목 돌림용, 말단장치 작동용','3개 – 어깨, 팔꿈치, 말단장치용','1개 – 팔꿈치 잠금용'],'팔꿈치관절장치를 굽힘시키고 말단장치를 작동하는 케이블 + 팔꿈치관절장치 잠김·풀림 케이블, 2개 사용.');
Q('C',7,'L','위팔케이블','3. 조절케이블 1) 팔꿈치관절 굽힘/말단장치 조절 케이블','의지를 최초로 착용할 때 elbow flexion attachment는 팔꿈치관절장치 축으로부터 먼쪽 약 얼마에 고정하는가?',['약 3cm','약 0.9cm','약 1.3cm','약 5cm','약 7.5cm'],'일반적으로 최초 착용 시 팔꿈치관절장치 축으로부터 먼쪽 약 3cm에 고정. 절단단이 길수록 축에서 멀리, 짧을수록 가까이.');
Q('C',7,'L','위팔케이블','3. 조절케이블 1) 팔꿈치관절 굽힘/말단장치 조절 케이블','위팔 의지 조절케이블에 대한 설명으로 옳은 것은?',['두 케이블 하우징의 간격이 멀어질수록 팔꿈치 굽힘 각도는 작아진다','두 케이블 하우징의 간격이 멀어질수록 굽힘 각도는 커진다','절단단이 길수록 elbow flexion attachment를 축 가까이 둔다','몸쪽 케이블 하우징은 아래팔에 부착된다','케이블 하우징은 1개로 이어져 있다'],'굽힘각도는 두 케이블 하우징 간격에 따라 제한(멀어질수록 각도 작아짐). 절단단이 길수록 attachment는 축에서 멀리 위치.');
Q('C',7,'L','위팔케이블','3. 조절케이블 2) 팔꿈치관절장치 잠금 조절 케이블','팔꿈치관절장치의 잠금·풀림 케이블을 당길 때 필요한 주행거리와 힘은?',['약 1.3cm, 0.9kg','약 0.9cm, 1.3kg','약 3cm, 0.9kg','약 2.5cm, 5kg','약 1.3cm, 5kg'],'잠금 조절 케이블: 약 1.3cm의 주행거리와 0.9kg의 힘 필요. 위팔소켓 앞을 지나 몸쪽 앞현가스트랩과 연결.');
Q('C',7,'R','위팔하니스','4. 하니스 1) 위팔 의지 표준 하니스 (2) 앞지지 스트랩','위팔 의지 표준 하니스의 앞지지 스트랩에 대한 설명으로 옳은 것은?',['팔꿈치관절의 잠김을 위해 먼쪽 약 2/3는 주로 탄력재질을 사용한다','몸쪽 약 1/2은 탄력재질을 사용한다','건측 어깨를 감싼다','조절케이블이 당겨질 때 소켓의 바깥돌림을 방지한다','축 하중을 지지한다'],'앞지지 스트랩: 먼쪽 약 2/3 정도는 주로 탄력재질. 절단측 어깨를 지나 소켓 앞안쪽을 통과, 소켓이 돌림되지 않게 함.');
Q('C',7,'R','위팔하니스','4. 하니스 1) (4) 가쪽지지 스트랩','위팔 의지 하니스에서 조절케이블이 당겨질 때 소켓이 바깥돌림되는 것을 방지하는 스트랩은?',['가쪽지지 스트랩','등 교차 스트랩','어깨 위 스트랩','조절 부착 스트랩','겨드랑 루프'],'가쪽지지 스트랩: 조절케이블이 당겨질 때 소켓이 바깥돌림 되는 것을 방지.');
Q('C',7,'R','위팔하니스','4. 하니스 1) (6) 팔꿈치관절 잠금 조절 스트랩','위팔 의지에서 팔꿈치관절 잠금·풀림을 조절하는 신체 움직임은?',['절단측 어깨관절 폄, 벌림, 약간의 내림','절단측 어깨관절 굽힘, 모음, 올림','양쪽 어깨뼈 벌림','건측 어깨관절 굽힘','절단측 어깨뼈 벌림과 어깨관절 굽힘'],'절단측 어깨관절 폄, 벌림, 약간의 내림으로 잠금 조절 스트랩과 케이블을 당김. (말단장치 작동은 어깨뼈 벌림 + 어깨관절 굽힘)');
Q('C',7,'R','위팔하니스','4. 하니스 1) (7) 등 교차 스트랩','조절 부착 스트랩이 위로 올라가지 않도록 아래에서 유지하기 위해 사용하는 스트랩은?',['등 교차 스트랩','어깨 위 스트랩','가쪽지지 스트랩','앞지지 스트랩','탄력 현가 스트랩'],'등 교차 스트랩: 조절 부착 스트랩이 위로 올라가지 않게 유지. 뒤교차점이 C7 가시돌기 이상 높으면 불편하고 하니스 효과가 감소하기 때문.');
Q('C',7,'R','위팔하니스','4. 하니스 1) (8) 어깨 위 스트랩','축 하중을 지지하고 가쪽지지 스트랩과 앞지지 스트랩에 안정성을 제공하는 스트랩은?',['어깨 위 스트랩','등 교차 스트랩','겨드랑 루프','조절 부착 스트랩','가슴 스트랩'],'어깨 위 스트랩: 축 하중을 지지, 가쪽지지 스트랩과 앞지지 스트랩에 안정성 제공.');
Q('C',7,'R','위팔하니스','4. 하니스 1) (3) 뒤 교차점','위팔 의지 하니스의 뒤 교차점이 아래팔 의지와 다른 점은?',['주로 재봉하고 링을 잘 사용하지 않는다','주로 금속 링을 사용한다','C7보다 위에 위치시킨다','절단측으로 치우쳐 위치시킨다','교차점이 없다'],'위팔 의지: 아래팔 의지와 달리 뒤 교차점을 주로 재봉하고 링을 잘 사용하지 않음. 위치는 C7 가시돌기 아래 약간 건측.');
Q('C',7,'R','위팔하니스','4) 양쪽 위팔 의지 하니스','양쪽 위팔 의지 하니스의 특징은?',['겨드랑 루프가 없고 등교차 스트랩과 어깨 위 스트랩이 필수적으로 적용된다','겨드랑 루프가 양쪽에 있다','가쪽지지 스트랩이 없다','조절 부착 스트랩이 없다','9자형으로 구성한다'],'양쪽 위팔 의지 하니스: 겨드랑 루프가 없고, 등교차 스트랩과 어깨 위 스트랩이 필수.');
Q('C',8,'L','신체측정','의지를 위한 신체 측정 1) (1) 절단측 팔의 측정','한쪽 팔 절단에서 절단단 둘레를 측정하는 간격은?',['겨드랑에서부터 5cm 간격, 먼쪽 끝 부위는 2.5cm 간격','겨드랑에서부터 2.5cm 간격, 먼쪽 끝 부위는 5cm 간격','전체 5cm 간격','전체 2.5cm 간격','겨드랑에서부터 10cm 간격, 먼쪽 끝 부위는 5cm 간격'],'절단단 둘레: 겨드랑에서부터 5cm 간격, 먼쪽 끝 부위는 2.5cm 간격. 길이는 어깨뼈봉우리~절단단 끝, 겨드랑~절단단 끝.');
Q('C',8,'L','신체측정','의지를 위한 신체 측정 1) (2) 건측 팔의 측정','건측 팔에서 아래팔 길이를 측정하는 구간은?',['위팔뼈 가쪽 위관절융기에서 엄지손가락의 끝까지','어깨뼈봉우리에서 위팔뼈 가쪽 위관절융기까지','팔꿈치머리에서 자뼈 붓돌기까지','위팔뼈 가쪽 위관절융기에서 가운데손가락 끝까지','겨드랑에서 손목까지'],'위팔 길이: 어깨뼈봉우리~위팔뼈 가쪽 위관절융기 / 아래팔 길이: 위팔뼈 가쪽 위관절융기~엄지손가락 끝.');
Q('C',8,'L','신체측정','의지를 위한 신체 측정 2) 양쪽 팔 절단의 측정','양쪽 팔 절단에서 의지 길이를 정하는 식으로 옳은 것은?',['위팔 = 키 × 0.19, 아래팔 = 키 × 0.21','위팔 = 키 × 0.21, 아래팔 = 키 × 0.19','위팔 = 키 × 0.15, 아래팔 = 키 × 0.25','위팔 = 키 × 0.19, 아래팔 = 키 × 0.19','위팔 = 키 × 0.25, 아래팔 = 키 × 0.21'],'양쪽 팔 절단: 위팔 = 키 × 0.19, 아래팔 = 키 × 0.21.');
Q('C',8,'L','어깨이단의지','어깨관절 이단 및 전사반부 의지 2) 프레임 소켓','어깨관절 이단 의지의 프레임 소켓은 어디까지 감싸는가?',['5번째 갈비뼈까지 몸통의 절반가량','3번째 갈비뼈까지 어깨만','10번째 갈비뼈까지 몸통 전체','젖꼭지 높이까지 몸통 전체','엉덩뼈능선까지'],'프레임 소켓: 틀 방식, 5번째 갈비뼈까지 몸통의 절반가량을 감싸 더 넓은 면에 적용.');
Q('C',8,'L','어깨이단의지','2. 어깨관절장치 1) 마찰하중식','마찰하중식 어깨관절장치 중 벌림, 모음, 굽힘, 폄이 가능한 것은?',['양축','단축','삼축','볼-소켓','잠금형'],'단축: 한쪽 면에서만 / 양축: 벌림, 모음, 굽힘, 폄 / 삼축: 돌림까지 추가 / 볼-소켓: 모든 움직임.');
Q('C',8,'L','어깨이단의지','2. 어깨관절장치 2) 잠금형','잠금형 어깨관절장치가 잠김 상태가 가능한 어깨관절 굽힘 각도의 수는?',['32가지','7가지','12가지','18가지','36가지'],'잠금형 어깨관절장치: 32가지 굽힘 각도에서 잠김. 내장 스프링으로 잠기고 케이블, nudge control, 전기 스위치로 풀림.');
Q('C',8,'L','어깨이단의지','3. 하니스 1) 흉부 가슴 스트랩','어깨관절 이단 의지 하니스에서 흉부 가슴 스트랩을 통해 전달되는 힘은?',['어깨뼈의 벌림에 의하여 생성된 힘','어깨관절 굽힘에 의하여 생성된 힘','턱의 움직임에 의한 힘','몸통 돌림에 의한 힘','어깨관절 올림에 의한 힘'],'흉부 가슴 스트랩: 어깨뼈의 벌림에 의해 생성된 힘이 가슴 스트랩을 통해 전달. 탄력 현가 스트랩: 바깥돌림 방지.');
Q('C',8,'R','어깨이단의지','3) 보조장치','nudge control에 대한 설명으로 옳은 것은?',['사용자의 턱을 이용해 팔꿈치관절 잠금과 풀림을 조절한다','케이블 주행 범위를 2배로 만든다','어깨관절 올림으로 팔꿈치를 조절한다','근전도 신호로 어깨관절을 잠근다','건측 손으로 손목장치를 돌린다'],'nudge control: 턱을 이용해 팔꿈치관절 잠금·풀림 조절. 양쪽 어깨관절 이단처럼 장애가 심한 환자에게 적용.');
Q('C',8,'R','어깨이단의지','3) 보조장치','어깨관절 이단 의지의 보조장치 중 허리벨트로 팔꿈치관절장치를 조절하는 신체 움직임은?',['절단측 어깨관절 올림(거상)','절단측 어깨관절 폄','양쪽 어깨뼈 벌림','턱 내밀기','몸통 굽힘'],'허리벨트: 팔꿈치관절장치를 조절하기 위한 신체 움직임은 절단측 어깨관절 올림(거상). 케이블 주행 증폭장치: 가동범위 2배.');
/* 문제은행 2 — 다리 의지·보조기 원리·팔 보조기·발 보조기/구두·AFO/KAFO (한글파일 8~22쪽) */

/* ===== D. 다리 의지 (8쪽 오른쪽 ~ 11쪽) ===== */
Q('D',8,'R','발가락사임','발가락 및 발 의지 - 발가락 의지','엄지발가락 절단에서 발가락 의지를 착용하는 효과가 아닌 것은?',['발꿈치뼈의 지방패드를 보존한다','보행의 진출기가 소실되는 것을 막는다','발허리발가락관절의 과다폄으로 신발이 변형되는 것을 예방한다','나머지 발가락이 절단쪽으로 쏠리는 것을 예방한다','신발 변형으로 인한 불편함을 예방한다'],'발가락 의지: 진출기 소실 방지, 발허리발가락관절 과다폄으로 인한 신발 변형 예방, 나머지 발가락 쏠림 예방. (지방패드 보존은 사임 절단의 장점)');
Q('D',8,'R','발가락사임','발목 관절 이단 의지','발목관절 이단(사임 절단) 의지의 장점으로 옳은 것은?',['발꿈치뼈의 지방패드가 보존되어 체중을 잘 지지하고 보행기능이 향상된다','절단단 먼쪽부가 가늘어 외관이 좋다','궁둥뼈에서 체중을 지지한다','의지발이 필요 없다','소켓 없이 착용한다'],'사임: 절단단 먼쪽부가 둥근 형태가 되는 외관 문제가 단점, 발꿈치뼈 지방패드 보존으로 체중지지·보행기능이 좋은 것이 장점.');
Q('D',8,'R','사임소켓','발목 관절 이단 의지 - 소켓 1) 캐나다식 소켓','사임 의지 소켓 중 소켓의 뒷부분을 분리하고 스트랩으로 조여주는 방식은?',['캐나다식 소켓','개방형 소켓','폐쇄형 소켓','PTB 소켓','플러그 핏 소켓'],'캐나다식: 소켓 뒷부분 분리 + 스트랩 / 개방형: 창문 형태로 안쪽 또는 뒤쪽 개방 / 폐쇄형: 소프트 인서트 사용, 개방부 불필요.');
Q('D',8,'R','사임소켓','발목 관절 이단 의지 - 소켓 3) 폐쇄형 소켓','사임 의지의 폐쇄형 소켓에서 창문 형태의 개방부가 필요하지 않은 이유는?',['PE-lite 같은 부드러운 폼 재질의 소프트 인서트로 절단단을 감싼 후 착용하기 때문','소켓 뒷부분을 분리하기 때문','실리콘 라이너와 셔틀락을 쓰기 때문','절단단이 원추형이기 때문','흡입 밸브를 쓰기 때문'],'폐쇄형 소켓: PE-lite 같은 소프트 인서트로 절단단을 감싼 후 착용 → 창문형 개방부가 필요하지 않음.');
Q('D',8,'R','사임발','2. 의지발 1) 사임용 SACH 발','사임용 SACH 발의 설명으로 옳은 것은?',['용골 부분이 딱딱하고 쿠션 발꿈치 부분이 적으며 용골은 나무나 알루미늄이다','용골이 부드럽다','쿠션 발꿈치 부분이 크다','사방으로 범퍼가 적용된다','용골이 카본 재질이다'],'사임용 SACH 발: 용골 딱딱, 쿠션 발꿈치 적음, 용골 재질은 나무나 알루미늄. 사임용 SAFE 발: 용골이 보다 부드러움.');
Q('D',9,'L','BK소켓','종아리 의지(BK의지) 소켓 1) PTB 소켓','PTB 소켓에 대한 설명으로 옳은 것은?',['앞벽은 무릎뼈의 1/2~1/3을 감싸고 무릎뼈 바(patellar bar)에서 대부분 체중을 지지한다','앞벽이 무릎뼈를 완전히 감싼다','라이너를 반드시 사용하고 흡입방식으로 착용한다','내벽과 외벽이 넓적다리뼈관절융기를 감싸 현가한다','궁둥뼈에서 체중을 지지한다'],'PTB: 앞벽은 무릎뼈의 1/2~1/3, patellar bar에서 대부분 체중지지. 내벽·외벽은 넓적다리뼈의 모음근 결절 높이까지.');
Q('D',9,'L','BK소켓','종아리 의지(BK의지) 소켓 1) PTB 소켓','PTB 소켓의 내벽과 외벽 높이는?',['넓적다리뼈의 모음근 결절 높이까지','무릎뼈 아래끝까지','정강뼈 거친면까지','넓적다리뼈 큰돌기까지','궁둥뼈결절까지'],'PTB 소켓: 내벽과 외벽은 넓적다리뼈의 모음근 결절 높이까지 적용.');
Q('D',9,'L','BK소켓','종아리 의지(BK의지) 소켓 2) TSB 소켓','TSB 소켓에 대한 설명으로 옳지 않은 것은?',['PTB 소켓에 비해 비용이 적게 든다','체중지지 표면을 증가시킨다','실리콘이나 우레탄 성분의 라이너를 반드시 사용한다','흡입방식으로 착용한다','PTB 소켓에 비해 제작시간이 단축된다'],'TSB: 체중지지 표면 증가, 실리콘/우레탄 라이너 필수, 흡입방식. 제작시간 단축·빨리 적용, 반면 부품 등 비용이 많이 듦.');
Q('D',9,'L','BK소켓','종아리 의지(BK의지) 소켓 3) VAS','절단단의 부피 변동 문제를 해결하기 위해 소켓과 라이너 사이의 공기량을 조절해주는 장치는?',['VAS','TSB','HSM','TES','KBM'],'VAS: 소켓과 라이너 사이 공기량을 조절. 슬리브로 외부 공기를 차단해 음압 유지.');
Q('D',9,'L','접촉면','2. 소켓의 접촉면 1) 경성 접촉면','경성 접촉면의 특징으로 옳은 것은?',['땀이 잘 발생하지 않고 소켓의 부피가 작다','말초혈관질환이나 피부가 얇은 경우에 적합하다','PE-lite 폼을 사용한다','HSM 막이 적용된다','체중지지 능력에 제한이 있는 경우 적합하다'],'경성 접촉면: 땀이 잘 발생하지 않고, 소프트 인서트나 라이너를 사용하지 않아 소켓 부피가 작음.');
Q('D',9,'L','접촉면','2. 소켓의 접촉면 2) 소프트 인서트','현재 소프트 인서트에 사용하는 재료는?',['PE-lite라는 폴리에틸렌 폼','네오프렌 합성고무','플라스티졸','저밀도 우레탄 폼','데이크론 웨빙'],'소프트 인서트: 소켓 안에 적용되는 내부 소켓, 현재는 PE-lite라는 폴리에틸렌 폼 재료 사용.');
Q('D',9,'L','접촉면','2. 소켓의 접촉면 3) 라이너','라이너가 적합한 경우로 제시된 것은?',['절단단이 짧거나 원뿔 형태여서 체중지지 능력에 제한이 있는 경우','땀이 많이 나지 않게 해야 하는 경우','소켓 부피를 가장 작게 해야 하는 경우','무릎 인대가 늘어난 경우','젖힌무릎이 있는 경우'],'라이너: 절단단이 짧거나 원뿔 형태처럼 체중지지 능력에 제한이 있는 경우 적합. HSM 막 + 배출밸브로 긴 절단단에도 사용.');
Q('D',9,'L','BK현가','3. 현가장치 1) (1) 관절융기위 커프','PTB 커프(스트랩)라고도 하는 현가장치는?',['관절융기위 커프','허리벨트','경첩형 현가장치','실레지안 벨트','TES 벨트'],'관절융기위 커프 = PTB 커프, 스트랩. 아래로는 두 갈래로 소켓 안가쪽, 위는 넓적다리뼈관절융기에서 조여짐.');
Q('D',9,'R','BK현가','3. 현가장치 1) (2) 허리벨트','종아리 의지의 허리벨트에서 체중 지지가 되는 부위는?',['엉덩뼈능선','궁둥뼈결절','큰돌기','무릎뼈 바','넓적다리뼈관절융기'],'허리벨트: 관절융기위 커프를 보조하기 위해 사용, 엉덩뼈능선에서 체중 지지.');
Q('D',9,'R','BK현가','3. 현가장치 2) 경첩형 현가장치','종아리 의지의 경첩형 현가장치에 대한 설명으로 옳은 것은?',['대퇴를 활용해 체중지지면을 늘리고 후방의 끈으로 젖힌무릎(전반슬)을 예방한다','넓적다리뼈관절융기를 감싸 현가한다','슬리브로 음압을 유지한다','활동적인 젊은 절단 장애인에게 적용한다','긴 절단단에 적용한다'],'경첩형: 체중지지면을 늘려 분산시킬 목적으로 대퇴 활용, 후방 끈으로 젖힌무릎 예방. 절단단이 짧은 경우나 노인에게 적용.');
Q('D',9,'R','PTB변형','3. 현가장치 3) (1) PTB-SC(KBM)','내벽과 외벽이 넓적다리뼈관절융기를 감싸도록 높이를 높여 현가기능을 제공하는 소켓은?',['PTB-SC(KBM)','PTB SC/SP(PTS)','TSB','PTB','플러그 핏'],'PTB-SC(KBM): 내벽·외벽이 넓적다리뼈관절융기를 감쌈. PTB SC/SP(PTS, PTES): 추가로 앞벽이 무릎뼈를 완전히 감쌈.');
Q('D',9,'R','PTB변형','3. 현가장치 3) (3) PTB SC/SP(PTS, PTES)','PTB SC/SP(PTS) 소켓의 특징은?',['내벽·외벽이 넓적다리뼈관절융기를 감싸고 앞벽이 무릎뼈를 완전히 감싼다','앞벽이 무릎뼈의 1/2~1/3만 감싼다','내벽과 외벽이 모음근 결절보다 낮다','라이너와 흡입 밸브가 필수이다','넓적다리 코르셋이 달려 있다'],'PTB SC/SP(PTS, PTES): 내벽 외벽이 넓적다리뼈관절융기뿐 아니라 앞벽의 무릎뼈를 완전히 감쌈.');
Q('D',9,'R','PTB변형','3. 현가장치 3) (2) 안쪽 웨지','PTB-SC 소켓에서 안쪽 웨지를 내벽에 삽입하는 이유는?',['안쪽넓은근의 위축에 의해 틈새가 발생하기 때문','가쪽넓은근이 비대해지기 때문','무릎뼈가 가쪽으로 치우치기 때문','정강뼈 먼쪽을 보호하기 위해','젖힌무릎을 예방하기 위해'],'안쪽 웨지: 종아리 절단의 경우 안쪽넓은근 위축으로 틈새 발생 → 웨지를 내벽에 삽입해 착용.');
Q('D',9,'R','BK현가','3. 현가장치 4) 1) 슬리브','슬리브 현가장치의 문제점으로 옳은 것은?',['안가쪽 안정성이 적고 열과 땀이 증가한다','피스톤 작용이 증가한다','젖힌무릎이 생긴다','체중지지면이 줄어든다','소음이 크다'],'슬리브: 피스톤 작용 감소, 안가쪽 안정성 적고, 열과 땀 증가 문제.');
Q('D',9,'R','SACH','4. 의지발 1) (1) SACH 발','SACH 발의 용골에 대한 설명으로 옳은 것은?',['발의 중앙부에 위치하며 세로 방향으로 발을 지지하는 딱딱한 나무 재질이다','유연한 용골로 가로면 돌림을 허용한다','사방으로 범퍼가 적용된다','카본 재질로 에너지를 저장한다','금속 축으로 발등굽힘을 허용한다'],'SACH: 가볍고 내구성 좋음. 용골은 발 중앙부에서 세로 방향으로 발을 지지하는 딱딱한 나무 재질.');
Q('D',9,'R','SACH','4. 의지발 1) (1) SACH 발','SACH 발의 용골 길이는 무엇에 비례하는가?',['발등굽힘에 대한 저항','발바닥굽힘에 대한 저항','충격흡수량','의지발의 무게','가로면 돌림 범위'],'용골의 길이는 발등굽힘에 대한 저항에 비례함.');
Q('D',9,'R','SACH','4. 의지발 1) (1) SACH 발','SACH 발의 뒤축 쿠션에 대한 설명으로 옳은 것은?',['체중이 무거운 사용자는 딱딱한 쿠션을 적용한다','체중이 무거운 사용자는 부드러운 쿠션을 적용한다','쿠션이 부드러울수록 시상면 안정성이 증가한다','발가락떼기에서 충격을 흡수한다','쿠션은 발등굽힘 저항을 결정한다'],'뒤축딛기에서 충격흡수. 체중이 무거운 사용자는 딱딱한 쿠션. 뒤축 쿠션이 부드러우면 저항이 약해져 시상면에서의 안정성이 감소.');
Q('D',10,'L','의지발','(2) SAFE 발','유연한 용골을 가져 자갈길이나 불규칙한 지면에서 편안하게 사용할 수 있는 비관절형 의지발은?',['SAFE 발','SACH 발','단축발','Greissinger 발','스터비'],'SAFE 발: 유연한 용골. 배굴, 저굴, 내번, 외번, 가로면 돌림 허용 → 불규칙한 지면에서 편안.');
Q('D',10,'L','의지발','2) 관절형 의지발 (1) 단축발','단축발에 대한 설명으로 옳은 것은?',['발등굽힘과 발바닥굽힘을 허용하며 범퍼로 조절하고, 의지에 하중을 주는 데 자신이 없는 사람에게 유용하다','사방으로 범퍼가 적용되어 무겁다','용골이 유연해 내번·외번을 허용한다','관절이 없어 가볍다','K4 수준 운동선수에게만 쓴다'],'단축발: 발등굽힘, 발바닥굽힘 허용, 범퍼로 조절. 의지에 많은 하중을 주는 데 자신이 없는 사람에게 유용.');
Q('D',10,'L','의지발','2) 관절형 의지발 (2) 다축발','대표적인 다축발은?',['Greissinger 발','SACH 발','SAFE 발','TRS','Hosmer'],'다축발: Greissinger 발이 대표. 사방으로 범퍼 적용, 불규칙한 지면에 적합. 관절부분이 크고 범퍼가 많아 무겁고 관리가 어려움.');
Q('D',10,'L','무릎이단','무릎관절 이단 의지','무릎관절 이단 의지의 체중지지에 대한 설명으로 옳은 것은?',['절단단의 끝부분에서 완전하게 체중지지를 할 수 있어 궁둥뼈 체중지지가 필요하지 않다','궁둥뼈결절에서 대부분 체중을 지지한다','무릎뼈 바에서 체중을 지지한다','엉덩뼈능선에서 체중을 지지한다','끝부분 체중지지가 불가능하다'],'무릎관절 이단: 절단단의 끝부분에서 완전한 체중지지 가능, 궁둥뼈에서 체중지지가 필요하지 않음.');
Q('D',10,'L','무릎이단','무릎관절 이단 의지 1) 폐쇄형 소켓','무릎관절 이단 의지 폐쇄형 소켓의 재질 적용으로 옳은 것은?',['먼쪽 부분은 딱딱한 재질, 몸쪽 부분은 유연성 재질','먼쪽 부분은 유연성 재질, 몸쪽 부분은 딱딱한 재질','전체를 딱딱한 재질','전체를 유연성 재질','안쪽은 딱딱하고 가쪽은 유연한 재질'],'넓적다리뼈관절융기 위에서 편안하게 감쌈. 먼쪽은 딱딱한 재질, 몸쪽은 유연성 재질.');
Q('D',10,'L','AK소켓','넓적다리 의지 소켓 1) 플러그 핏 소켓','플러그 핏 소켓의 특징으로 옳은 것은?',['원통형 외형이며 절단단 양말로 접촉면 두께를 조절해 소켓이 회전되는 경향이 있다','궁둥뼈 시트에서 체중을 지지한다','bony lock 기전을 제공한다','스칼파 삼각부가 반대힘을 제공한다','네 모서리에 경감부가 있다'],'플러그 핏: 절단단 모양과 부피에 맞게 제작, 원통형. 절단단 양말로 접촉면 두께 조절 → 소켓이 회전되는 경향.');
Q('D',10,'L','장사방형','넓적다리 의지 소켓 2) 장사방형 소켓','장사방형 소켓의 뒤가쪽 모서리가 공간을 제공하는 근육은?',['큰볼기근','긴모음근','넙다리곧은근','넙다리뒤근','넙다리빗근'],'앞안쪽: 긴모음근 / 앞가쪽: 넙다리곧은근 경감부, 뒤가쪽: 큰볼기근이 수축해 커지는 공간, 뒤안쪽: 넙다리뒤근 경감부.');
Q('D',10,'L','장사방형','넓적다리 의지 소켓 2) 장사방형 소켓','장사방형 소켓의 뒤안쪽 모서리에 경감부가 제공되는 근육은?',['넙다리뒤근','큰볼기근','긴모음근','넙다리곧은근','넙다리빗근'],'뒤안쪽 모서리: 넙다리뒤근을 위한 경감부. 뒤가쪽: 큰볼기근.');
Q('D',10,'L','장사방형','넓적다리 의지 소켓 2) 장사방형 소켓','장사방형 소켓에서 체중을 지지하는 구조는?',['뒤벽 내측의 궁둥뼈 시트 위에 놓이는 궁둥뼈결절과 둔부근육','앞벽의 스칼파 삼각부','외벽 위의 큰돌기','절단단의 끝부분','내벽의 모음근 결절'],'뒤벽의 내측에 넓고 지면과 수평을 이루는 궁둥뼈 시트 → 궁둥뼈결절과 둔부근육이 그 위에 위치해 체중지지. 스칼파 삼각부는 반대힘 제공.');
Q('D',10,'R','장사방형','스칼파 삼각부','스칼파 삼각부를 이루는 구조물로 옳은 것은?',['가쪽의 넙다리빗근, 안쪽의 긴모음근, 위의 샅고랑인대','가쪽의 긴모음근, 안쪽의 넙다리빗근, 위의 샅고랑인대','가쪽의 넙다리곧은근, 안쪽의 큰모음근, 위의 엉덩뼈능선','가쪽의 큰볼기근, 안쪽의 넙다리뒤근, 위의 궁둥뼈결절','가쪽의 넙다리빗근, 안쪽의 넙다리곧은근, 아래의 샅고랑인대'],'스칼파 삼각부: 가쪽 넙다리빗근, 안쪽 긴모음근, 위 샅고랑인대.');
Q('D',10,'R','장사방형','장사방형 소켓 - 외벽','장사방형 소켓의 외벽은 궁둥뼈 시트를 기준으로 약 얼마나 높은가?',['약 7cm','약 2.5cm','약 5cm','약 10cm','약 20cm'],'외벽은 높이가 가장 높은 벽으로 궁둥뼈 시트를 기준으로 약 7cm가량 높음.');
Q('D',10,'R','AK소켓','3) 궁둥뼈 수납형 소켓','궁둥뼈 수납형 소켓의 특징은?',['뒤벽이 궁둥뼈와 궁둥뼈가지 위로 더 높게 연장되고 bony lock 기전을 제공한다','궁둥뼈 시트 위에 궁둥뼈결절이 놓인다','원통형으로 회전되기 쉽다','절단단 끝에서 체중을 지지한다','앞벽이 가장 높은 벽이다'],'궁둥뼈 수납형: 뒤벽이 궁둥뼈와 궁둥뼈가지(좌골지) 위로 더 높게 연장되어 포함, 외벽에서 넓적다리뼈 위까지 적용해 bony lock 기전 제공.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 2) 다중심 무릎관절장치','다중심(4절 연쇄) 무릎관절장치에 대한 설명으로 옳지 않은 것은?',['흔듦기 동안 의지 정강부의 길이가 길어진다','뒤축닫기 동안 안정성을 높여준다','발가락 떼기에서 안정성을 감소시켜 흔듦기를 쉽게 시작한다','무릎관절장치를 적용할 공간이 부족한 경우 적합하다','짧은 대퇴 절단단이나 고관절 폄근이 약한 경우에도 편하다'],'다중심: 흔듦기 동안 굽힘되면서 의지 정강부 길이를 「짧아지게」 해 지면간격을 개선.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 1) 단축 무릎관절장치','디딤기의 안정성이 정렬상태나 사용자의 근수축에 따라 좌우되는 무릎관절장치는?',['단축 무릎관절장치','다중심 무릎관절장치','체중이용 디딤기 조절 무릎관절장치','수동잠금 무릎관절장치','유압식 무릎관절장치'],'단축 무릎관절장치: 디딤기의 안정성이 정렬상태나 사용자의 근수축에 따라 좌우됨.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 3) 체중이용 디딤기 조절','체중을 이용해 하중을 주면 잠금상태가 되어 무릎이 고정되며, 디딤기 조절이 어려운 쇠약한 절단장애인에게 적합한 것은?',['체중이용 디딤기 조절 무릎관절장치','수동잠금 무릎관절장치','다중심 무릎관절장치','공압식 무릎관절장치','단축 무릎관절장치'],'체중이용 디딤기 조절: 하중을 주면 잠금 → 무릎 고정. 디딤기 조절이 어려운 쇠약한 절단장애인에게 적합.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 4) 수동잠금 무릎관절장치','수동잠금 무릎관절장치에 대한 설명으로 옳지 않은 것은?',['흔듦기 동안 무릎이 굽힘되어 에너지 소모가 감소한다','항상 폄 상태에서 고정되어 있다','디딤기 동안 최대의 안정성을 제공한다','쇠약하고 불안정한 절단장애인에게 적합하다','무릎을 굽히려면 수동으로 잠금장치를 풀어야 한다'],'수동잠금: 흔듦기 동안 굽힘이 되지 않아 에너지 소모가 「증가」하고 보행편위가 발생.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 5) 공압식','공압식 무릎관절장치에서 실린더 윗부분의 포트를 크게 개방하면 저항은?',['감소한다','증가한다','변하지 않는다','잠금상태가 된다','유압으로 전환된다'],'공압식: 포트를 크게 개방할수록 저항 감소, 적게 할수록 저항 증가. 흔듦기 조절.');
Q('D',10,'R','무릎장치','2. 무릎관절장치 6) 유압식','유압식 무릎관절장치가 공압식과 다른 점은?',['실린더 내에 유체가 들어 있다','실린더가 없다','디딤기에서만 작동한다','피스톤 로드가 없다','수동으로 잠근다'],'유압식: 공압식과 유사하나 실린더 내에 유체가 들어 있는 것이 다름.');
Q('D',11,'L','AK현가','3. 현가장치 1) 흡입 현가장치','넓적다리 의지의 흡입 현가장치의 원리는?',['공기배출밸브로 소켓 안의 공기를 모두 배출시켜 공기의 음압을 이용한다','골반 벨트로 엉덩뼈능선에 건다','넓적다리뼈관절융기 위를 조인다','허리부분을 벨크로로 감싼다','핀 라이너와 셔틀락으로 고정한다'],'흡입 현가장치: 공기배출밸브를 적용해 소켓 안의 공기를 모두 배출 → 음압 이용.');
Q('D',11,'L','AK현가','3. 현가장치 2) (1) 측면 엉덩이 관절장치와 골반 벨트','측면 엉덩이 관절장치와 골반 벨트가 적합한 경우가 아닌 것은?',['절단단이 길고 근력이 좋은 활동적인 경우','엉덩관절 모음근이 약한 경우','절단단이 매우 짧은 경우','비만이거나 과다한 연부조직이 있는 경우','협동 능력이 감소한 경우'],'골반 벨트: 의지 돌림 방지, 강력한 골반 안가쪽 안정성. 비만·과다한 연부조직, 모음근 약함, 매우 짧은 절단단, 협동 능력 감소, 절단단 형성이 좋지 않은 경우.');
Q('D',11,'L','AK현가','3. 현가장치 2) (2) 실레지안 벨트','실레지안 벨트의 주행 경로로 옳은 것은?',['소켓의 대전자 부위에서 시작해 건측 엉덩뼈능선을 통과하여 소켓의 앞부분에 부착','소켓의 앞부분에서 시작해 절단측 엉덩뼈능선을 지나 뒤벽에 부착','소켓 몸쪽 약 20cm와 허리부분을 감싸고 앞에서 벨크로로 고정','소켓 내벽에서 시작해 건측 어깨를 지나 뒤벽에 부착','궁둥뼈 시트에서 시작해 허리를 한 바퀴 감아 고정'],'실레지안 벨트: 소켓의 대전자 부위 → 건측 엉덩뼈능선 통과 → 소켓의 앞부분에 부착.');
Q('D',11,'L','AK현가','3. 현가장치 2) (3) TES 벨트','TES 벨트가 감싸는 범위는?',['소켓의 몸쪽 약 20cm가량과 허리부분','소켓의 몸쪽 약 5cm와 골반','소켓 전체와 건측 넓적다리','소켓의 먼쪽 약 20cm와 무릎','허리부분만'],'TES 벨트: 소켓의 몸쪽 약 20cm가량과 허리부분을 감싸고 앞에서 벨크로로 고정.');
Q('D',11,'L','기능부품','4. 기능증진을 위한 부품 1) 토크 흡수장치','의지의 장축에 대하여 가로돌림을 가능하게 해주어 절단단과 소켓 사이의 전단력 발생을 막아주는 부품은?',['토크 흡수장치','회전장치','VAS','공압 실린더','셔틀락'],'토크 흡수장치: 의지 장축에 대한 가로돌림 가능, 비틀림 하중에 대응, 절단단과 소켓 사이 전단력 발생을 막아줌.');
Q('D',11,'L','엉덩이단','엉덩관절 이단 및 골반 의지','캐나다식 엉덩관절 이단 의지에서 엉덩이관절장치의 위치는?',['절단단의 앞아래','절단단의 뒤아래','절단단의 가쪽','인체 엉덩관절과 같은 높이의 안쪽','절단단의 바로 위'],'엉덩이관절장치는 인체와 같은 높이에 적용하기 어려워 절단단의 앞아래에 위치 → 이러한 정렬 방식이 캐나다식 엉덩관절 이단 의지.');
Q('D',11,'L','엉덩이단','엉덩관절 이단 및 골반 의지 2. 의지발','엉덩관절 이단 및 골반 의지에서 주로 사용하는 의지발은?',['무게가 가볍고 경제적인 SACH 발','Greissinger 다축발','에너지저장형 의지발','단축발','SAFE 발'],'엉덩관절 이단 및 골반 의지: 무게가 가볍고 경제적인 SACH 발을 주로 사용.');
Q('D',11,'R','하반신양측','하반신 의지 - 좌식의지','하반신 절단 소켓의 목표 중 착용 인내력 기준은?',['하루에 최소 4시간씩 두 번','하루에 최소 1시간씩 네 번','하루에 최소 8시간 한 번','하루에 최소 2시간씩 세 번','목욕 시간을 제외하고 하루 종일'],'좌식의지: 하루에 최소 4시간씩 두 번 소켓 착용을 견딜 수 있는 인내력.');
Q('D',11,'R','하반신양측','양쪽 다리 절단을 위한 의지 - 양쪽 종아리 의지','양쪽 종아리 의지는 절단되기 전 다리길이보다 얼마나 짧게 해주는가?',['약 2.5cm','약 0.6cm','약 1.3cm','약 5cm','약 7.5cm'],'양쪽 종아리 의지: 절단 전 다리길이보다 약 2.5cm 짧게. (스터비 5~7.5cm, 넓적다리 의지 0.6~1.3cm와 구분)');
Q('D',11,'R','하반신양측','2. 종아리의지와 넓적다리 의지','한쪽 종아리 의지와 한쪽 넓적다리 의지를 함께 사용할 때 옳은 것은?',['종아리 의지를 우세 다리로 사용하고 넓적다리 의지를 0.6~1.3cm 짧게 한다','넓적다리 의지를 우세 다리로 사용하고 종아리 의지를 0.6~1.3cm 짧게 한다','두 의지의 길이를 똑같이 한다','넓적다리 의지를 2.5cm 길게 한다','종아리 의지를 5~7.5cm 짧게 한다'],'종아리 의지를 우세 다리로, 넓적다리 의지를 0.6~1.3cm 짧게 → 보행 동안 발가락 떼기를 편하게. 종아리 의지 발은 쿠션이 적은 단축발, 발바닥굽힘 범퍼는 딱딱하게.');
Q('D',11,'R','하반신양측','3. 양쪽 넓적다리 의지','스터비(stubby) 의지는 절단 전 다리길이에 비해 얼마나 짧은가?',['5~7.5cm','0.6~1.3cm','2.5cm','10~15cm','20cm 이상'],'양쪽 넓적다리 의지: 궁둥뼈 수납형 소켓 선호. 스터비 의지는 절단 전 다리길이에 비해 5~7.5cm 더 짧음.');

/* ===== E. 보조기의 원리 (12쪽) ===== */
Q('E',12,'L','삼점압','보조기의 원리 1) 삼점압 원리','삼점압 원리의 정의로 옳은 것은?',['두 방향의 압력과 이와 반대되는 한 점의 압력이 필요하다','세 점의 압력이 모두 같은 방향이어야 한다','네 방향에서 지지력이 적용된다','연부조직을 유체처럼 압박한다','신체 분절의 양 끝을 잡아당긴다'],'삼점압: 보조기의 지지력은 세 개의 방향으로부터 적용, 두 방향의 압력과 반대되는 한 점의 압력 필요.');
Q('E',12,'L','삼점압','보조기의 원리 1) 삼점압 원리','목뼈 부위를 지지하는 보조기에서 두 점의 힘이 적용되는 곳은?',['턱과 뒤통수','복장뼈와 골반부','이마와 턱','어깨와 뒤통수','복장뼈와 뒤통수'],'목뼈 보조기: 턱과 뒤통수에 두 점의 힘 + 머리의 무게(중력). 등뼈·허리뼈: 복장뼈와 골반부에 두 점, 등뼈·허리뼈에 한 점.');
Q('E',12,'L','삼점압','보조기의 원리 1) 삼점압 원리','등뼈나 허리뼈를 교정하는 보조기에서 두 점의 힘이 적용되는 곳은?',['복장뼈와 골반부','턱과 뒤통수','엉덩뼈와 넓적다리뼈 몸쪽','넓적다리 뒤와 장딴지','어깨뼈와 엉치뼈'],'등뼈·허리뼈 교정: 복장뼈와 골반부에 두 점의 힘, 등뼈나 허리뼈에 한 점의 힘.');
Q('E',12,'L','삼점압','보조기의 원리 1) 삼점압 원리','무릎관절 폄을 위한 삼점압에서 두 점의 힘이 적용되는 곳은?',['넓적다리 뒤와 장딴지','넓적다리 앞과 정강이','무릎뼈와 발꿈치','엉덩뼈와 넓적다리뼈 몸쪽','발바닥과 발목'],'무릎관절 폄: 넓적다리 뒤와 장딴지에 두 점의 힘, 무릎관절에 한 점의 힘.');
Q('E',12,'L','보조기원리','보조기의 원리 2) 사점압 원리','사점압 원리가 적용된 예로 제시된 것은?',['parapodium(파라포디움)','밀워키 보조기','PTB 보조기','턴버클 팔꿈치 관절 장치','무릎뼈밑 스트랩'],'사점압: 두 개의 삼점압이 적용. parapodium처럼 가슴 밴드·다리 밴드의 뒤 방향 힘과 등쪽 허리뼈 밴드·신발지지대 뒷면의 앞방향 힘.');
Q('E',12,'L','보조기원리','보조기의 원리 3) 압박의 원리','「액압지지」라고도 불리는 보조기의 원리는?',['압박의 원리','신연의 원리','전단력의 원리','삼점압 원리','사점압 원리'],'압박의 원리: 연부조직이나 유체압박을 통해 외부에서 압박력을 제공, 액압지지라고도 함.');
Q('E',12,'L','보조기원리','보조기의 원리 3) 압박의 원리','압박의 원리를 이용한 예가 아닌 것은?',['턴버클을 적용한 팔꿈치 관절 장치','노뼈 골절에 적용하는 공기 팽창 보조기','무릎뼈힘줄염에 적용하는 무릎뼈밑 스트랩','체중지지를 위한 PTB 보조기','연부조직을 압박해 지지하는 보조기'],'턴버클 팔꿈치 관절 장치는 「신연의 원리」의 예. 압박의 예: 노뼈 골절 공기 보조기, 무릎뼈밑 스트랩, PTB 보조기.');
Q('E',12,'L','보조기원리','보조기의 원리 4) 신연의 원리','신체 분절의 양 끝을 잡아당김으로써 발생하는 장력이 신체 분절의 가쪽 안정성을 증가시키는 원리는?',['신연의 원리','압박의 원리','전단력의 원리','삼점압 원리','사점압 원리'],'신연의 원리. 예: 턴버클 팔꿈치 관절 장치(관절주머니를 수동적으로 신장), 코일 스프링이 적용된 AFO의 배굴보조.');
Q('E',12,'L','보조기원리','보조기의 원리 4) 신연의 원리','코일 스프링이 적용된 발목관절-발 보조기가 흔듦기 동안 신발을 위로 당겨 배굴보조를 하는 것은 어떤 원리의 예인가?',['신연의 원리','압박의 원리','전단력의 원리','삼점압 원리','액압지지'],'코일 스프링 AFO의 배굴보조도 신연의 예.');
Q('E',12,'R','보조기원리','보조기의 원리 5) 전단력의 원리','전단력의 원리가 적용된 예로 옳은 것은?',['밀워키 보조기가 골반대를 기준으로 패드를 적용해 측만증 만곡을 교정하는 것','공기를 팽창시키는 노뼈 골절 보조기','턴버클 팔꿈치 관절 장치','무릎뼈밑 스트랩','파라포디움의 가슴 밴드'],'전단력: 서로 다른 방향의 수평력(가위가 대표). 밀워키 보조기, 무릎관절보조기에서 넓적다리뼈에 대해 정강뼈가 앞으로 미끄러지는 것에 저항.');

/* ===== F. 팔 보조기 (12쪽 오른쪽 ~ 16쪽 왼쪽) ===== */
Q('F',12,'R','팔보조기목적','팔 보조기 착용목적 2) 기능의 회복','한 관절에서 다른 관절로 일률을 기계적으로 이동시키며 wrist driven prehension orthosis가 예인 보조기는?',['능동적 기능성 보조기','동적 기능성 보조기','수동적 기능성 보조기','정적 보조기','연속적 정적 보조기'],'동적 기능성: 외부 동력·동적 부품(외부 동력식 보조기) / 능동적 기능성: 일률을 기계적으로 이동(wrist driven prehension) / 수동적 기능성: 불안정한 관절 안정.');
Q('F',12,'R','팔보조기목적','팔 보조기 착용목적 2) 기능의 회복','탈신경된 근육의 기능을 대신하기 위해 외부 동력이나 동적인 부품을 사용하는 보조기는?',['동적 기능성 보조기','능동적 기능성 보조기','수동적 기능성 보조기','점진적 정적 보조기','정적 보조기'],'동적 기능성 보조기: 탈신경된 근육의 기능을 대신, 불충분한 근력 보조. 외부 동력식 보조기가 예.');
Q('F',12,'R','팔보조기목적','팔 보조기 착용목적 3) 기형 및 누적 외상의 예방','resting pan 보조기를 적용하는 대상으로 제시된 것은?',['이완성 반신마비 환자','C6 사지마비 환자','볼크만 허혈성 구축 환자','가쪽위관절융기염 환자','빗장뼈 골절 환자'],'resting pan: 기능적 자세를 유지하는 손목관절-손 보조기, 이완성 반신마비 환자에게 적용, 손허리손가락 관절 가동성 유지.');
Q('F',12,'R','팔보조기분류','2. 팔보조기의 분류 1) 역학적 특성','점진적 정적 보조기가 동적 보조기와 다른 점은?',['나일론 끈, 스트랩, 나사, 턴버클 같은 비탄력적 부품으로 가동력을 전달한다','고무밴드와 스프링을 사용한다','반복적으로 재성형한다','제거할 수 없는 원주형이다','관절을 완전히 고정한다'],'점진적 정적 보조기: 동적 보조기와 유사하나 비탄력적 부품(나일론 끈, 스트랩, 나사, 턴버클)을 사용.');
Q('F',13,'L','팔보조기분류','(4) 연속적 정적 보조기','연속적 정적 보조기의 특징으로 옳은 것은?',['길어진 자세로 유지하기 위해 반복적으로 재성형하며 주로 원주형이고 제거할 수 없다','턴버클로 가동력을 전달한다','능동-저항 운동 도구로 사용한다','외부 동력을 사용한다','착용자가 수시로 벗을 수 있다'],'연속적 정적: 관절, 연부 조직, 근-건 단위를 길어진 자세로 유지하기 위해 반복적으로 재성형. 주로 원주형(둘레형), 제거할 수 없는 형태.');
Q('F',13,'L','팔보조기분류','3) 적용 부위에 따른 분류','보조기 약어의 연결이 옳지 않은 것은?',['SEO – 어깨-팔꿈치-손목 관절 보조기','HO – 손 보조기','WHO – 손목관절-손 보조기','EO – 팔꿈치관절 보조기','SEWO – 어깨-팔꿈치-손목 관절 보조기'],'SEO: 어깨-팔꿈치관절 보조기. SEWO가 어깨-팔꿈치-손목 관절 보조기.');
Q('F',13,'L','엄지보조기','손 보조기 - 엄지 보조기 1) basic opponens orthosis','짧은 맞섬보조기에서 thumb abduction bar(C bar)의 기능은?',['엄지를 벌림 상태로 유지하고 엄지두덩갈퀴막공간 구축을 예방한다','제1 손허리뼈가 다른 손가락 면에서 이탈되지 않게 한다','손허리손가락관절의 폄을 정지시킨다','손목관절을 손등굽힘 상태로 유지한다','가로손바닥활을 지지한다'],'C bar: 엄지를 벌림 상태로 유지, 엄지 모음 및 엄지두덩갈퀴막공간 구축 예방, 맞섬될 수 있는 자세 유지.');
Q('F',13,'L','엄지보조기','손 보조기 - 엄지 보조기 1) basic opponens orthosis','짧은 맞섬보조기에서 맞섬바(opponens bar)의 기능은?',['제1 손허리뼈가 다른 손가락 면에서 이탈되지 않도록 한다','엄지를 벌림 상태로 유지한다','손가락뼈사이관절의 폄을 보조한다','손바닥이 편평해지는 것을 막는다','손목처짐을 예방한다'],'opponens bar: 제1 손허리뼈가 다른 손가락 면에서 이탈되지 않도록 함. (손바닥 편평 방지는 손등쪽 바·손바닥쪽 바)');
Q('F',13,'L','엄지보조기','손 보조기 - 엄지 보조기 1) basic opponens orthosis','짧은 맞섬보조기(basic opponens orthosis)가 적합한 경우는?',['정중신경 손상으로 인한 유인원 손(원숭이손)','노신경마비로 인한 손목처짐','자뼈신경 손상으로 인한 갈퀴손','백조목 변형','단추구멍 변형'],'정중신경 손상으로 인한 엄지두덩 구축과 엄지두덩 위축으로 인한 유인원 손(원숭이손)에 적합.');
Q('F',13,'L','엄지보조기','2) rigid thumb orthosis(thumb post)','rigid thumb orthosis(thumb post)를 사용하지 않는 경우는?',['엄지의 갈퀴막 공간이 너무 팽팽한 경우','엄지두덩이 위축된 경우','손바닥활이 낮아진 경우','손목처짐이 있는 경우','부종이 없는 경우'],'thumb post: C bar의 기능을 대신하기 위해 연장 지지대를 opponens bar에 연결. 엄지 갈퀴막 공간이 너무 팽팽하면 사용 안 함.');
Q('F',13,'L','엄지보조기','4) thumb spica orthosis','thumb spica orthosis의 적용 질환은?',['엄지의 관절염이나 힘줄윤활막염','정중신경 손상','볼크만 허혈성 구축','백조목 변형','갈퀴손'],'thumb spica: 플라스틱 재질로 엄지의 손허리손가락관절을 감싸 고정. 엄지의 관절염이나 힘줄윤활막염에 적용.');
Q('F',13,'R','손가락보조기','2. 손가락 보조기 2) finger knuckle bender','finger knuckle bender(IP flexion assist)의 작용과 적용 변형으로 옳은 것은?',['PIP 굽힘·DIP 폄 – 백조목 변형','PIP 폄·DIP 굽힘 – 단추구멍 변형','PIP 굽힘·DIP 폄 – 단추구멍 변형','PIP 폄·DIP 굽힘 – 백조목 변형','MP 굽힘 – 갈퀴손'],'finger knuckle bender: PIP 굽힘, DIP 폄. 내재근 구축과 류마티스 관절염으로 발생하는 백조목 변형에 적용.');
Q('F',13,'R','손가락보조기','2. 손가락 보조기 3) reverse finger knuckle bender','reverse finger knuckle bender(IP ex orth)의 작용과 적용 변형으로 옳은 것은?',['PIP 폄·DIP 굽힘 – 단추구멍 변형','PIP 굽힘·DIP 폄 – 백조목 변형','PIP 폄·DIP 굽힘 – 백조목 변형','PIP 굽힘·DIP 폄 – 단추구멍 변형','MP 폄 – 갈퀴손'],'reverse finger knuckle bender: PIP 폄, DIP 굽힘. 단추구멍 변형(boutonniere deformity)에 적용.');
Q('F',13,'R','손가락보조기','2. 손가락 보조기 4) finger extensor assist orth','손가락을 폄시키기 위해 기본형 보조기에 부착하는 장치의 이름은?',['아우트리거','lumbrical bar','C bar','opponens bar','턴버클'],'finger extensor assist: 고무밴드와 MP 폄 정지장치로 손가락뼈사이관절 폄 보조. 부착 장치 = 아우트리거. 볼크만 허혈성 구축에 적용.');
Q('F',13,'R','손가락보조기','2. 손가락 보조기 4) finger extensor assist orth','finger extensor assist orth를 적용하는 변형은?',['볼크만 허혈성 구축','백조목 변형','단추구멍 변형','유인원 손','날개어깨뼈'],'finger extensor assist orth: 볼크만 허혈성 구축(Volkmann ischemic contracture) 변형에 적용.');
Q('F',13,'R','MP보조기','3. 손허리손가락관절 보조기 1) knuckle bender','knuckle bender(MP flexion orth)를 적용하는 갈퀴손(claw hand)의 양상은?',['손허리손가락관절의 과다폄과 몸쪽·먼쪽 손가락뼈사이관절의 굽힘','손허리손가락관절의 굽힘과 손가락뼈사이관절의 폄','PIP 과다폄과 DIP 굽힘','PIP 굽힘과 DIP 과다폄','손목관절의 처짐'],'갈퀴손: 정중신경과 자뼈신경 손상으로 뼈사이근·벌레근 마비 → MP 과다폄, PIP·DIP 굽힘. knuckle bender는 MP를 굽힘시킴.');
Q('F',13,'R','MP보조기','3) dorsal lumbrical bar','lumbrical bar로 몸쪽 마디를 약 15° 굽힘 자세로 유지하려면 손허리손가락관절이 약 몇 도 굽힘되도록 조립해야 하는가?',['약 30°','약 15°','약 20°','약 45°','약 90°'],'몸쪽 마디 약 15° 굽힘 유지 → MP가 약 30° 굽힘이 되도록 lumbrical bar를 조립(보조기와 손가락 사이에 공간 필요).');
Q('F',14,'L','손보조기','4. 손에 대한 보조기 3) universal cuff','universal cuff에 대한 설명으로 옳은 것은?',['손바닥의 가죽 주머니에 숟가락·연필 등을 끼워 사용하며 C5 사지마비처럼 마비가 심하면 손목관절-손 보조기에 연결한다','화상 환자의 흉터를 예방한다','엄지·검지·중지를 고정해 잡기동작을 제공한다','손가락을 모두 벌려 경직을 감소시킨다','어깨세모근 기능이 남아야 쓸 수 있다'],'universal cuff: 손바닥 주머니에 도구를 끼워 사용. C5 사지마비처럼 마비가 심하면 WHO에 연결해 불수의적 손목 동작 방지.');
Q('F',14,'L','손보조기','4. 손에 대한 보조기 4) 압박글러브','압박글러브(pressure gauntlet)의 적용 대상은?',['화상 환자','류마티스 관절염 환자','C6 사지마비 환자','노신경마비 환자','빗장뼈 골절 환자'],'압박글러브: 화상 환자에게 새살 형성을 조절, 흉터가 커지는 것을 예방하기 위해 맞춤형으로 적용.');
Q('F',14,'L','손보조기','4. 손에 대한 보조기 2) finger-driven prehension hand orth','finger-driven prehension hand orth를 적용할 수 없는 경우는?',['부종이 심한 경우','손이 유연한 경우','변형이 없는 경우','엄지와 손가락을 기능적 자세로 유지할 수 있는 경우','잡기동작이 필요한 경우'],'엄지, 검지, 중지를 고정시켜 잡기동작 제공. 손이 유연하고 변형이 없어야 하며, 부종이 심한 경우 적용 안 됨.');
Q('F',14,'L','손목자세','손목관절-손 보조기','손목관절-손 보조기에서 유지하는 손목의 안정 자세는?',['약 10~15° 자뼈 편위와 20~35° 손등쪽굽힘','약 10~15° 노뼈 편위와 20~35° 손바닥쪽굽힘','약 20~35° 자뼈 편위와 10~15° 손등쪽굽힘','중립 편위와 45° 손등쪽굽힘','약 5° 자뼈 편위와 90° 손등쪽굽힘'],'손목관절은 약 10~15°의 자뼈(새끼손가락) 편위와 20~35° 손등쪽굽힘 상태 유지.');
Q('F',14,'L','WHO','long opponens orth(긴 맞섬 보조기)','long opponens orth(긴 맞섬 보조기)의 기능은?',['손목관절을 고정된 자세로 유지하고 손목처짐(wrist drop)을 예방한다','손가락을 모두 벌려 경직을 감소시킨다','PIP를 굽힘, DIP를 폄시킨다','팔꿈치 굽힘 구축을 교정한다','어깨관절 아탈구를 막는다'],'long opponens: basic opponens orth의 손등쪽에 아래팔 바가 연결되어 손목관절까지 조절. 손목처짐 예방.');
Q('F',14,'L','WHO','3. dorsal wrist hand stabilizer','dorsal wrist hand stabilizer가 resting pan orth와 다른 점은?',['손등쪽에 적용한다','손목을 손바닥굽힘으로 유지한다','손가락을 벌림시킨다','클렌작 관절을 사용한다','아래팔이 회내된 자세에서만 쓴다'],'dorsal wrist hand stabilizer: 기능은 resting pan orth와 같지만 손등쪽에 적용시킨 점이 다름.');
Q('F',14,'R','cockup','4. cock up orth','cock up orth에서 유지하는 손목관절 자세는?',['20~30° 손등굽힘','20~35° 손바닥굽힘','10~15° 손등굽힘','중립','45~60° 손등굽힘'],'cock up: 손목관절을 20~30° 손등굽힘 상태로 유지하고 손바닥활 지지. 손바닥 주름까지만 적용되어 손가락은 자유로움.');
Q('F',14,'R','cockup','4. cock up orth','cock up orth를 적용하는 대표적인 경우는?',['노신경마비로 인한 손목처짐','정중신경 손상으로 인한 유인원 손','자뼈신경 손상으로 인한 갈퀴손','긴가슴신경 병변으로 인한 날개어깨뼈','C4 사지마비'],'cock up: 노신경마비로 인한 손목처짐에 적용, 손목관절 굽힘 구축 방지. 손등굽힘 시 건고정(tenodesis) 작용으로 잡기동작 증진.');
Q('F',14,'R','WHO','5. wrist extension assist orth','pope wrist joint 보조기에서 사용하는 관절은?',['클렌작 관절','톱니바퀴형 손목관절 힌지','스텝-업 힌지','볼-소켓 관절','dial lock'],'wrist extension assist: 고무밴드, 스프링 강선, 클렌작 관절 등 이용. wire형은 강철 밴드·패드·스프링 강철선, pope wrist jt 보조기는 클렌작 관절.');
Q('F',14,'R','WHO','6. Bunnell dorsal wrist splint','Bunnell dorsal wrist splint의 구조는?',['세 개의 편평한 금속 패드가 아래팔, 손, 손가락의 손등쪽에 놓인다','두 개의 플라스틱 셸이 손바닥쪽에 놓인다','한 개의 강선이 아래팔 안쪽을 지난다','가죽 주머니가 손바닥에 달린다','톱니바퀴형 힌지가 손목에 달린다'],'Bunnell dorsal wrist splint: 세 개의 편평한 금속재료 패드가 아래팔, 손과 손가락의 손등쪽에 놓임.');
Q('F',14,'R','WHO','7. 항경직 보조기','항경직 보조기(antispasticity orth)의 특징은?',['손가락을 모두 벌림시키며 고정한다','손가락을 모두 모아 굽힘시킨다','엄지만 벌림시킨다','손목을 손바닥굽힘으로 고정한다','아래팔을 회외로 고정한다'],'항경직 보조기: 손과 손목관절의 굽힘 협동작용을 반대로 적용해 경직 감소. 손가락을 모두 벌림시키며 고정.');
Q('F',14,'R','사지마비보조기','8. flexor hinge orth','flexor hinge orth에 대한 설명으로 옳은 것은?',['C6 사지마비에게 적용하며 아래팔이 회내(엎침)된 자세에서만 사용한다','C4 사지마비에게 적용하며 전기로 구동한다','C6 사지마비에게 적용하며 아래팔이 회외된 자세에서만 사용한다','이완성 반신마비에게 적용한다','어깨세모근과 위팔두갈래근이 남아야 사용한다'],'flexor hinge: C6 사지마비의 일상생활동작 촉진, 아래팔이 회내된 자세에서만 사용. C5는 고정 기능을 위해 톱니바퀴형 손목관절 힌지.');
Q('F',14,'R','사지마비보조기','9. electrically-driven prehension orth','손목관절 폄근을 조절하기에 충분하지 않은 C4 또는 C5 사지마비 환자에게 적용하는 잡기동작 보조기는?',['electrically-driven prehension orth','flexor hinge orth','universal cuff','cock up orth','finger-driven prehension hand orth'],'electrically-driven prehension orth: 손목관절 폄근 조절이 충분하지 않은 C4 또는 C5 사지마비 환자.');
Q('F',15,'L','팔꿈치보조기','팔꿈치관절 보조기 - forearm cuff(tennis elbow strap)','tennis elbow strap(forearm cuff)의 착용 방법으로 옳은 것은?',['3~4시간 간격으로 긴장을 느슨하게 하고 밤에는 장착하지 않는다','목욕 시간을 제외하고 하루 종일 착용한다','밤에만 착용한다','하루 4시간씩 두 번 착용한다','한 번 착용하면 풀지 않는다'],'순환장애가 발생할 수 있어 3,4시간 간격으로 긴장을 느슨하게 하고 밤에는 장착 안 함. 가쪽위관절융기염 환자에게 적용.');
Q('F',15,'L','팔꿈치보조기','2. elbow extensor orth','팔꿈치관절 굽힘 구축이 있을 때 턴버클로 커프 사이 간격을 늘려가며 사용하는 보조기는?',['elbow extensor orth','elbow control orth','rigid elbow orth','forearm cuff','airplane orth'],'elbow extensor orth: 굽힘 구축에 적용. 위팔·아래팔 커프를 연결하는 턴버클로 구축이 치유됨에 따라 간격을 늘려감.');
Q('F',15,'L','팔꿈치보조기','3. elbow control orth','elbow control orth의 기능은?',['팔꿈치관절의 안가쪽 안정성을 유지하고 굽힘·폄 각도를 제한한다','팔꿈치관절을 완전히 고정한다','팔꿈치 부위의 긴장력을 감소시켜 염증을 억제한다','어깨관절 아탈구를 막는다','아래팔의 돌림을 보조한다'],'elbow control orth: 안가쪽 안정성 유지, 굽힘·폄 각도 제한. 조절용 힌지 사용. 인대수술 후 측부인대 재건 등에 적용.');
Q('F',15,'L','팔꿈치보조기','4. rigid elbow orth','rigid elbow orth에 대한 설명으로 옳은 것은?',['팔꿈치관절을 굽힘시켜 고정하며 힌지가 없는 형태이다','조절용 힌지로 각도를 제한한다','턴버클로 간격을 늘린다','폄 상태로만 고정한다','가쪽위관절융기염에 적용한다'],'rigid elbow orth: 움직임이 발생하지 못하도록 고정, 굽힘시켜 고정하며 힌지가 없음. 만성 류마티스 관절염이나 수술 후 사용.');
Q('F',15,'L','팔걸이','어깨관절 보조기 - 팔걸이(sling)','팔걸이 착용으로 위축될 수 있다고 제시된 근육은?',['어깨세모근, 가시위근, 위팔세갈래근','위팔두갈래근, 큰가슴근, 넓은등근','앞톱니근, 등세모근, 마름근','가시아래근, 작은원근, 어깨밑근','위팔근, 위팔노근, 부리위팔근'],'팔걸이 착용 → 활동성 감소, 굽힘근 경직을 상쇄하는 어깨세모근, 가시위근, 위팔세갈래근이 위축될 수 있음.');
Q('F',15,'L','팔걸이','어깨관절 보조기 - 팔걸이(sling)','팔걸이 안에서 팔이 놓이는 자세로 굽힘근 경직이 강화될 수 있는 것은?',['굽힘, 모음, 엎침, 안쪽돌림','폄, 벌림, 뒤침, 가쪽돌림','굽힘, 벌림, 뒤침, 가쪽돌림','폄, 모음, 엎침, 안쪽돌림','굽힘, 모음, 뒤침, 가쪽돌림'],'팔걸이 안에서 팔이 굽힘, 모음, 엎침, 안쪽돌림 되기 때문에 굽힘근의 경직이 강화될 수 있음.');
Q('F',15,'R','팔걸이','3) 위팔 커프 팔걸이(humeral cuff sling)','수직형 팔걸이(vertical sling)라고도 하는 것은?',['위팔 커프 팔걸이','현가형 팔걸이','벌림형 팔걸이','swathe arm sling','single-strap sling'],'위팔 커프 팔걸이: 아래팔 지지대 대신 위팔을 감싸는 넓은 커프. 팔이 수직으로 내려와 수직형 팔걸이. 착용 상태에서도 옷을 입을 수 있음.');
Q('F',15,'R','팔걸이','6) 현가형 팔걸이(suspension sling, overhead sling)','현가형 팔걸이(overhead sling)에 대한 설명으로 옳은 것은?',['C5 척수손상 환자에게 적용하며 침상모서리나 휠체어의 연장된 바에 부착한다','빗장뼈 골절 고정에 사용한다','위팔을 감싸는 넓은 커프를 사용한다','가볍고 부드러운 천으로 몸통에 고정한다','어깨관절을 90° 벌림으로 고정한다'],'현가형 팔걸이: C5 척수손상 환자, 중력의 균형과 반작용 이용. 침상모서리나 휠체어의 연장된 바에 부착.');
Q('F',15,'R','팔걸이','5) swathe arm sling','가볍고 부드러운 천 재질로 고정성이 뛰어나 어깨관절 아탈구, 돌림근띠 병변, 위팔뼈머리밑 골절, 어깨뼈 골절에도 적용하는 것은?',['swathe arm sling','multiple-strap sling','humeral cuff sling','suspension sling','8자형 빗장뼈 스트랩'],'swathe arm sling: 가볍고 부드러운 천, 벨크로 조절. 고정성이 뛰어나 아탈구, 타박상, 염좌, 돌림근띠 병변, 위팔뼈머리밑 골절, 어깨뼈 골절에 적용.');
Q('F',15,'R','어깨보조기','2. 8자형 빗장뼈 스트랩','8자형 빗장뼈 스트랩의 적용으로 옳은 것은?',['빗장뼈 골절 시 수술하지 않고 골절 치유 목적으로 고정한다','어깨관절 아탈구를 막는다','날개어깨뼈를 고정한다','어깨관절을 벌림 상태로 유지한다','위팔신경얼기 마비에서 팔을 매단다'],'8자형 빗장뼈 스트랩: 빗장뼈 골절의 비수술 고정. 어깨가슴관절 내밈 구축에도 적용.');
Q('F',15,'R','어깨보조기','3. 어깨뼈 고정 보조기(scapula fixation orth)','어깨뼈 고정 보조기를 적용하는 날개어깨뼈(익상견갑골)의 원인은?',['긴가슴신경의 병변이나 앞톱니근(전거근) 마비','노신경마비','겨드랑신경 손상과 어깨세모근 마비','정중신경 손상','위팔신경얼기 전체 마비'],'긴가슴신경 병변이나 앞톱니근(전거근) 마비 → 어깨관절 올림·굽힘 소실, 팔을 앞으로 밀지 못하는 날개어깨뼈. 삼점압 원리 사용.');
Q('F',15,'R','어깨보조기','3. 어깨뼈 고정 보조기(scapula fixation orth)','어깨뼈 고정 보조기에서 사용하는 원리와 패드 배치는?',['큰 압력패드로 어깨뼈 위를 덮고 두 개의 작은 패드는 부리돌기 부위에서 압박하는 삼점압 원리','네 개의 패드를 사용하는 사점압 원리','공기를 팽창시키는 압박의 원리','턴버클을 이용한 신연의 원리','골반대를 기준으로 한 전단력의 원리'],'큰 압력패드로 어깨뼈 위를 덮고, 두 개 작은 패드는 부리돌기 부위에서 압박해 삼점압 원리 사용.');
Q('F',16,'L','어깨보조기','4. 어깨관절 벌림보조기(airplane orth)','어깨관절 벌림보조기(airplane orth)에서 유지하는 자세는?',['어깨관절 90° 벌림 및 바깥돌림, 팔꿈치관절 굽힘, 아래팔 뒤침','어깨관절 45° 벌림 및 안쪽돌림, 팔꿈치관절 폄, 아래팔 엎침','어깨관절 90° 굽힘 및 안쪽돌림, 팔꿈치관절 굽힘, 아래팔 엎침','어깨관절 90° 벌림 및 안쪽돌림, 팔꿈치관절 폄, 아래팔 뒤침','어깨관절 모음, 팔꿈치관절 굽힘, 아래팔 엎침'],'airplane orth: 어깨관절 90° 벌림 및 바깥돌림, 팔꿈치관절 굽힘, 아래팔 뒤침, 손은 기능적 자세.');
Q('F',16,'L','어깨보조기','4. 어깨관절 벌림보조기(airplane orth)','airplane orth의 적용 대상이 아닌 것은?',['빗장뼈 골절','화상','분만마비(Erb’s palsy)','돌림근띠 파열','어깨관절 수술 후'],'airplane orth: 화상, 위팔신경얼기, 분만마비(Erb), 어깨관절 주위근(돌림근띠) 파열, 어깨관절 수술 후. 빗장뼈 골절은 8자형 빗장뼈 스트랩.');
Q('F',16,'L','비부착형','신체 비부착형 보조기 2. balanced forearm orth(BFO)','BFO(balanced forearm orth)를 효과적으로 사용하려면 기능이 잔존해야 하는 근육은?',['어깨세모근과 위팔두갈래근','위팔세갈래근과 넓은등근','손목 폄근과 굽힘근','앞톱니근과 등세모근','가시위근과 가시아래근'],'BFO: C4, C5 사지마비 환자에게 사용, 어깨세모근과 위팔두갈래근의 기능이 잔존해야 효과적.');
Q('F',16,'L','비부착형','신체 비부착형 보조기 2. balanced forearm orth(BFO)','BFO(feeder)의 적용 대상은?',['C4, C5 사지마비 환자','C6 사지마비 환자','C7, C8 사지마비 환자','이완성 반신마비 환자','T1 하반신마비 환자'],'BFO는 C4, C5 사지(팔다리)마비 환자에게 사용. 식사, 세면, 글씨쓰기 등 일상생활동작 수행을 도움.');
Q('F',16,'L','비부착형','신체 비부착형 보조기 1. arm trough','아래팔을 지지해야 하는 휠체어 사용자에게 주로 사용하는 신체 비부착형 보조기는?',['arm trough','universal cuff','swathe arm sling','resting pan','cock up orth'],'arm trough: 아래팔을 지지해야 하는 휠체어 사용자에게 주로 사용.');

/* ===== G. 발 보조기·구두 (16쪽 오른쪽 ~ 19쪽 왼쪽) ===== */
Q('G',16,'R','발보조기','발 보조기 - 구성 2) 포스트','양성석고모델에서 석고 수정 후 성형 가공하는 포스트는?',['내재 포스트','외재 포스트','발앞부 포스트','발뒤부 포스트','발앞부 연장부'],'내재 포스트: 양성석고모델에서 석고 수정 후 성형 가공. 외재 포스트: 발 보조기 바닥면에 재료를 추가.');
Q('G',16,'R','발보조기','발 보조기 - 구성 2) (4) 발뒤부 포스트','보행의 뒤축딛기에서 발꿈치뼈의 움직임을 조절하는 데 사용하는 것은?',['발뒤부 포스트','발앞부 포스트','내재 포스트','셸','발앞부 연장부'],'발뒤부 포스트: 발뒤부 지지, 정렬 상태 조절, 뒤축딛기에서 발꿈치뼈 움직임 조절.');
Q('G',16,'R','발보조기','발 보조기 - 구성 2) (3) 발앞부 포스트','발앞부 포스트가 비정상적인 움직임과 보상작용을 감소시키는 관절은?',['목말밑관절과 발허리발가락관절','발목관절과 무릎관절','발꿈치입방관절과 목말발배관절','발가락뼈사이관절','발목발허리관절'],'발앞부 포스트: 쿠션기능, 발앞부 지지. 목말밑관절과 발허리발가락관절의 비정상적 움직임과 보상작용 감소.');
Q('G',16,'R','발보조기','발 보조기 - 구성 3) 발앞부 연장부','발앞부 연장부는 발꿈치뼈에서 발허리뼈머리까지로, 발 길이의 어느 정도로 적용되는가?',['3/4','1/2','1/3','2/3','전체'],'발앞부 연장부: 발꿈치뼈에서부터 발허리뼈머리까지, 발 길이의 3/4 정도.');
Q('G',16,'R','발보조기','2. 발보조기의 종류 1) 경성 발 보조기','경성 발 보조기의 대표적인 보조기는?',['UCBL 보조기','CROW','SMO','PLS AFO','CAM walker'],'경성 발 보조기: 발의 변형이 심한 경우. 목말밑관절 엎침 조절에 매우 효과적. 대표: UCBL 보조기.');
Q('G',16,'R','발보조기','2. 발보조기의 종류 2) 연성 발 보조기','연성 발 보조기를 주로 사용하는 경우는?',['신경증, 혈관성 및 궤양성 질환','발의 변형이 심한 경우','목말밑관절 엎침이 심한 경우','다리길이 차이가 큰 경우','선천성 발 변형의 교정'],'연성 발 보조기: 신경증, 혈관성 및 궤양성 질환에 주로 사용.');
Q('G',17,'L','구두어퍼','3. 구두 1) (1) 어퍼 가. Blucher 형','Blucher 형 구두에 대한 설명으로 옳은 것은?',['구두 목의 앞부분이 분리되어 구두 혀가 쉽게 젖혀지므로 부종이 있는 환자에게 적합하다','구두 목의 앞부분이 분리되지 않고 연결되어 있다','발가락 끝까지 끈으로 조인다','복사뼈보다 4~5cm 위까지 올라온다','굽 가슴이 거의 없다'],'Blucher: 구두 목의 앞부분이 분리. 구두 혀가 쉽게 젖혀져 부종 환자에게 적합, 인서트 적용 가능. Balmoral: 분리되지 않고 연결.');
Q('G',17,'L','구두어퍼','3. 구두 1) (1) 어퍼 나. Balmoral 형','구두목의 앞부분이 분리되지 않고 연결되어 있는 구두 형태는?',['Balmoral 형','Blucher 형','lace to lace','high quarter','Oxford'],'Balmoral 형: 구두목의 앞부분이 분리되지 않고 연결.');
Q('G',17,'L','구두어퍼','3. 구두 1) (1) 어퍼 ② 뒷날개 가. low quarter','low quarter(단화, Oxford화)의 높이는?',['복사뼈보다 2~3cm 낮게','복사뼈보다 4~5cm 낮게','복사뼈보다 2~3cm 위','복사뼈보다 4~5cm 위','복사뼈와 같은 높이'],'low quarter: 복사뼈 밑이 상한선, 복사뼈보다 2~3cm 낮게. 단화 또는 Oxford화. high quarter: 복사뼈보다 약 4~5cm 위, 장화·high up shoes, 벨크로 사용.');
Q('G',17,'L','구두어퍼','3. 구두 1) (1) 어퍼 ② 뒷날개 나. high quarter','high quarter에 대한 설명으로 옳은 것은?',['복사뼈보다 약 4~5cm 위에 위치하고 고정된 꿈치들린휜발을 감싸기 위해 적용한다','복사뼈보다 2~3cm 낮게 제작된다','단화 또는 Oxford화라고 한다','발목관절의 움직임을 제한하지 않는다','벨크로보다 끈을 사용한다'],'high quarter: 발목관절을 감싸 고정된 꿈치들린휜발에 적용. 복사뼈보다 약 4~5cm 위, 장화·high up shoes, 끈보다 벨크로.');
Q('G',17,'L','구두창','3. 구두 1) (2) 구두창 ① 대다리(welt)','구두의 가장자리에 위치한 얇고 긴 가죽 부분으로, 중창과 어퍼를 연결하고 방수 기능을 하는 것은?',['대다리(welt)','볼(ball)','슈 브레이크','월형(counter)','허리쇠(shank)'],'대다리(welt): 구두 가장자리의 얇고 긴 가죽. 중창과 어퍼를 연결, 방수 기능.');
Q('G',17,'L','구두창','3. 구두 1) (2) 구두창 ③ 슈 브레이크','슈 브레이크에 대한 설명으로 옳은 것은?',['발허리발가락관절과 일치하는 선으로 구두를 신었을 때 구부러지는 부위이다','구두창의 가장 넓은 부분이다','보행할 때 구르는 효과를 제공한다','중창과 어퍼를 연결한다','구두의 허리를 보강한다'],'슈 브레이크: 발허리발가락관절과 일치하는 선, 구부러지는 부위. 볼: 구두창의 가장 넓은 부분(발허리뼈머리와 동일 선상). 토우 스프링: 구르는 효과.');
Q('G',17,'L','구두창','3. 구두 1) (2) 구두창 ④ 토우 스프링','보행할 때 구르는 효과를 제공하여 발가락떼기를 돕는 것은?',['토우 스프링','슈 브레이크','볼(ball)','선심(toe box)','대다리(welt)'],'토우 스프링: 보행할 때 구르는 효과를 제공하여 발가락떼기 도움.');
Q('G',17,'R','구두굽','3. 구두 1) (3) 구두 굽','구두 굽의 종류와 높이의 연결이 옳은 것은?',['옥스퍼드 굽 2.5cm, 군화굽 3cm, cuban heel 4cm','옥스퍼드 굽 3cm, 군화굽 2.5cm, cuban heel 4cm','옥스퍼드 굽 2.5cm, 군화굽 4cm, cuban heel 3cm','옥스퍼드 굽 1.3cm, 군화굽 2.5cm, cuban heel 3cm','옥스퍼드 굽 4cm, 군화굽 3cm, cuban heel 2.5cm'],'2.5cm 옥스퍼드 굽, 3cm 군화굽, 4cm cuban heel, 굽 가슴이 거의 없는 spring heel.');
Q('G',17,'R','구두굽','3. 구두 1) (3) 구두 굽','성인용 2.5cm 높이의 굽이 하는 역할은?',['중력중심점을 앞으로 이동시켜 디딤기를 통한 움직임에 도움을 준다','중력중심점을 뒤로 이동시켜 안정성을 높인다','발목관절의 움직임을 제한한다','발바닥활을 높인다','다리길이 차이를 보정한다'],'성인용 2.5cm 굽: 중력중심점을 앞으로 이동 → 디딤기를 통한 움직임에 도움.');
Q('G',17,'R','보강재','3. 구두 1) (4) 보강재 ② 월형(counter)','구두의 뒷날개를 단단한 가죽으로 보강한 것으로, 발바닥활이 낮아졌거나 바깥굽음된 발을 지지하기 위해 자주 사용하는 것은?',['월형(counter)','선심(toe box)','허리쇠(steel shank)','대다리(welt)','화형'],'월형(counter): 뒷날개에 가죽을 덧대거나 단단한 가죽으로 보강. 발바닥활이 낮아졌거나 바깥굽음된 발 지지.');
Q('G',17,'R','보강재','3. 구두 1) (4) 보강재 ③ 허리쇠(steel shank)','허리쇠(steel shank)의 두께는?',['1~2mm의 강철판','3~4mm의 강철판','4mm의 알루미늄판','7~8mm의 강철판','1.3cm의 가죽'],'허리쇠: 1~2mm의 강철판으로 구두의 허리를 보강.');
Q('G',17,'R','발바닥활','2) 구두의 수정 - 발바닥활','가쪽 세로발바닥활을 구성하는 뼈는?',['발꿈치뼈, 입방뼈, 두 개의 가쪽 발허리뼈','발꿈치뼈, 목말뼈, 발배뼈, 세 개의 쐐기뼈, 세 개의 안쪽 발허리뼈','발배뼈, 쐐기뼈, 입방뼈, 발허리뼈','목말뼈, 발배뼈, 입방뼈','발꿈치뼈, 목말뼈, 입방뼈'],'안쪽 세로활: 발꿈치뼈, 목말뼈, 발배뼈, 세 쐐기뼈, 세 안쪽 발허리뼈 / 가쪽 세로활: 발꿈치뼈, 입방뼈, 두 가쪽 발허리뼈 / 가로활: 발배뼈, 쐐기뼈, 입방뼈, 발허리뼈.');
Q('G',17,'R','발바닥활','2) 구두의 수정 - 발바닥활','발의 체중부하점이 이루는 삼각지점은?',['제1 발허리뼈머리, 제5 발허리뼈머리, 발꿈치뼈의 바닥면','제1 발허리뼈머리, 제3 발허리뼈머리, 발꿈치뼈','엄지발가락, 새끼발가락, 발꿈치뼈','발배뼈, 입방뼈, 발꿈치뼈','제2 발허리뼈머리, 제5 발허리뼈머리, 목말뼈'],'발의 체중부하점: 제1 발허리뼈머리, 제5 발허리뼈머리, 발꿈치뼈의 바닥면이 이루는 삼각지점.');
Q('G',17,'R','안쪽활수정','(1) 안쪽 세로발바닥활 지지 ① 구두 안 수정 다. long counter(medial)','long counter(medial)는 월형을 어디까지 연장하는가?',['제1 발허리뼈머리까지','제5 발허리뼈머리 바로 뒤까지','발배뼈 바로 밑까지','슈 브레이크 앞까지','엄지발가락 끝까지'],'long counter(medial): 월형을 제1 발허리뼈머리까지 연장. (lateral은 제5 발허리뼈머리 바로 뒤까지)');
Q('G',18,'L','안쪽활수정','② 구두밖 수정 가. Thomas heel','Thomas heel에 대한 설명으로 옳은 것은?',['구두굽의 안쪽을 앞으로 약 1.5cm 연장하여 발배뼈 바로 밑에 닿게 한다','구두굽의 외측을 앞으로 돌출시켜 발꿈치입방관절을 지지한다','구두굽의 안쪽을 앞으로 약 4cm 연장한다','발허리뼈머리 뒤에 부착하는 쉼표 모양의 바이다','굽을 안쪽으로 더 넓게 한다'],'Thomas heel: 구두굽의 안쪽을 앞으로 약 1.5cm 연장, 발배뼈 바로 밑에 닿게 해 체중이 안쪽으로 이동되는 현상 방지.');
Q('G',18,'L','안쪽활수정','② 구두밖 수정 마. 바깥굽음 스트랩','발의 바깥굽음을 방지하기 위한 바깥굽음 스트랩이 부착되는 곳은?',['구두의 안쪽','구두의 가쪽','구두의 뒤축','구두의 앞코','가쪽 업라이트'],'바깥굽음 스트랩: T자형이나 Y자형, 구두의 안쪽에 부착. (안쪽굽음 스트랩은 구두의 가쪽에 부착)');
Q('G',18,'L','안쪽활수정','라. cookie insert','cookie insert에 대한 설명으로 옳은 것은?',['발배뼈 패드와 모양이 유사하고 사용자의 발바닥활 모양에 맞게 딱딱한 가죽으로 만든다','발허리뼈머리 뒤에 붙이는 쉼표 모양의 바이다','엄지와 검지발가락 사이에 끼우는 실리콘이다','구두굽의 안쪽을 연장한 것이다','월형을 길게 연장한 것이다'],'cookie insert: 발배뼈 패드와 모양이 유사, 발바닥활 모양에 맞게 딱딱한 가죽으로 만듦.');
Q('G',18,'L','가쪽활수정','(2) 가쪽 세로발바닥활 지지 ② 구두 밖 수정 가. reverse Thomas heel','reverse Thomas heel이 지지해 줄 수 있어야 하는 관절은?',['발꿈치입방관절','목말발배관절','발배-제1쐐기 관절','발허리발가락관절','목말밑관절'],'reverse Thomas heel: 구두굽 외측이 앞쪽으로 돌출, 발꿈치입방관절을 지지해줄 수 있어야 함.');
Q('G',18,'L','가쪽활수정','(2) 가쪽 세로발바닥활 지지 ① 구두 안 수정 나. long counter(lateral)','long counter(lateral)를 효과적으로 적용하려면 월형을 어디까지 연장하는가?',['제5 발허리뼈머리 바로 뒤까지','제1 발허리뼈머리까지','입방뼈 앞까지','새끼발가락 끝까지','발꿈치뼈 앞까지'],'long counter(lateral): 월형을 제5 발허리뼈머리 바로 뒤까지 연장. (medial은 제1 발허리뼈머리까지)');
Q('G',18,'L','가쪽활수정','(2) 가쪽 세로발바닥활 지지 ② 구두 밖 수정 마. Hauser bar','Hauser bar에 대한 설명으로 옳은 것은?',['발허리뼈머리 뒤에 부착하며 토마스 힐과 함께 사용되는 쉼표 모양의 바이다','신발의 끝까지 연장된 바이다','가로발바닥활을 상승시키는 바이다','구두굽 외측을 돌출시킨 것이다','엄지발가락을 연장시킨 것이다'],'Hauser bar: 발허리뼈머리 뒤에 부착, 토마스 힐과 함께 사용되는 쉼표 모양의 바. 평발에 적용되어 발앞부 뒤침을 방지·교정.');
Q('G',18,'L','가쪽활수정','(2) 가쪽 세로발바닥활 지지 ② 구두 밖 수정 바. 안쪽굽음 스트랩','안쪽굽음 스트랩에 대한 설명으로 옳은 것은?',['구두의 가쪽에 부착되며 가쪽 복사뼈 위로 약 4cm까지 스트랩이 나뉜다','구두의 안쪽에 부착되며 안쪽 복사뼈 위로 약 4cm까지 올라간다','구두의 가쪽에 부착되며 약 1.5cm까지 올라간다','굽 가슴에서 슈 브레이크 사이의 안쪽에 부착된다','T자형으로 구두의 뒤축에 부착된다'],'안쪽굽음 스트랩: 구두의 가쪽에 부착. 가쪽 복사뼈 위로 약 4cm까지 스트랩이 나뉨.');
Q('G',18,'R','가로활수정','(3) 가로발바닥활 지지 ① 구두 안 수정 가. 발허리뼈 패드','발허리뼈 패드를 위치시키는 곳은?',['발허리뼈머리의 약간 뒤쪽','발허리뼈머리의 바로 밑','발허리뼈머리의 약간 앞쪽','발배뼈 바로 밑','발꿈치뼈 앞'],'발허리뼈 패드: 강직성 발이나 발허리뼈가 벌림된 평발에서 압력을 줄이기 위해 발허리뼈머리의 약간 뒤쪽에 위치.');
Q('G',18,'R','가로활수정','(3) 가로발바닥활 지지 ① 구두 안 수정 마. Morton’s toe extension','Morton’s toe extension을 적용하는 Morton’s toe의 원인은?',['제1 발허리뼈가 비정상적으로 짧아져 통증이 발생한다','제2 발허리뼈가 비정상적으로 짧아진다','엄지발가락이 가쪽으로 휜다','발꿈치뼈가 안쪽으로 기운다','제5 발허리뼈머리에 주머니염이 생긴다'],'Morton’s toe extension: 엄지발가락을 연장시킨 것. 제1 발허리뼈가 비정상적으로 짧아져 통증이 발생하는 Morton’s toe에 적용.');
Q('G',18,'R','가로활수정','(3) 가로발바닥활 지지 ① 구두 안 수정 라. Levy type inlay와 toe separator','toe separator에 대한 설명으로 옳은 것은?',['엄지와 검지발가락 사이에 적용하고 실리콘이나 우레탄 젤로 제작하며 야간에도 사용할 수 있다','발바닥활 지지대의 앞부분에 스폰지를 붙인 것이다','딱딱한 가죽으로 만들어 낮에만 사용한다','발허리뼈머리 뒤에 붙인다','새끼발가락 바깥에 적용한다'],'toe separator: 엄지와 검지발가락 사이, 실리콘이나 우레탄 젤, 야간에도 사용 가능. Levy type inlay: 발바닥활 지지대 앞부분에 스폰지·고무 적용.');
Q('G',18,'R','바','(3) 가로발바닥활 지지 ② 구두 밖 수정 나. rocker bar','rocker bar가 metatarsal bar와 다른 점은?',['신발의 끝까지 연장되어 있고 디딤기에서 부드러운 구르기가 되도록 한다','발허리뼈머리 뒤에서 끝난다','쉼표 모양이다','구두 안에 삽입한다','가로발바닥활을 상승시켜 발허리뼈를 뒤로 당긴다'],'rocker bar: metatarsal bar에 비해 신발 끝까지 연장, 가장 두꺼운 부분은 제1~5 발허리뼈머리를 따라 평행. 체중 재분배, 부드러운 구르기.');
Q('G',18,'R','바','(3) 가로발바닥활 지지 ② 구두 밖 수정 다. Denver bar','가로발바닥활이 상승됨에 따라 발허리뼈가 뒤로 당겨지는 효과를 제공하는 바는?',['Denver bar','rocker bar','metatarsal bar','Hauser bar','Thomas heel'],'Denver bar: 가로발바닥활 상승 → 발허리뼈가 뒤로 당겨지는 효과, 발허리뼈머리 하중 감소.');
Q('G',18,'R','바','(3) 가로발바닥활 지지 ② 구두 밖 수정 가. metatarsal bar','metatarsal bar의 목적은?',['발허리뼈머리에 가해지는 압박을 감소시킨다','발꿈치뼈의 움직임을 조절한다','체중이 안쪽으로 이동되는 것을 막는다','발의 바깥굽음을 방지한다','다리길이 차이를 보정한다'],'metatarsal bar: 발허리뼈머리에 가해지는 압박 감소. 가죽이나 단단한 고무로 제작.');
Q('G',19,'L','구두높이기','라. SACH heel','SACH heel의 기능은?',['뒤축닫기 동안 충격을 완화하고 약간의 반발력으로 진출기를 돕는다','발허리뼈머리의 압박을 줄인다','발배뼈 밑을 받쳐 체중의 안쪽 이동을 막는다','가로발바닥활을 상승시킨다','발가락떼기에서 구르는 효과를 준다'],'SACH heel: 뒤축닫기 동안 충격 완화, 약간의 반발력을 이용해 진출기를 도움.');
Q('G',19,'L','구두높이기','(4) 구두 높이기','하지 길이를 측정하는 구간은?',['골반의 앞위엉덩뼈가시에서 안쪽 복사뼈까지','큰돌기에서 가쪽 복사뼈까지','엉덩뼈능선에서 발바닥까지','배꼽에서 가쪽 복사뼈까지','궁둥뼈결절에서 발꿈치까지'],'하지 길이는 골반의 앞위엉덩뼈가시에서 안쪽 복사뼈까지 측정.');
Q('G',19,'L','구두높이기','(4) 구두 높이기','다리 길이 차이가 1.3cm 이상일 때 구두 높이기 방법은?',['구두굽과 함께 구두창에서 구두굽 높임의 약 50%를 추가로 높인다','구두굽만 높이고 구두창은 높이지 않는다','구두창만 높인다','구두굽과 구두창을 같은 높이로 높인다','구두 안 인서트만 넣는다'],'1.3cm 이하: 구두굽만 높임 / 1.3cm 이상: 구두굽과 함께 구두창에서 구두굽 높임의 약 50%를 추가로 높임.');
Q('G',19,'L','구두높이기','(4) 구두 높이기','골반의 경사로 인해 다리 길이 차이가 나는 경우의 대처는?',['구두굽 수정보다는 골반의 수평을 유지하도록 한다','구두굽을 1.3cm 높인다','구두창을 50% 높인다','rocker bar를 부착한다','짧은 쪽에 SACH heel을 적용한다'],'하지 길이 차이가 아닌 골반의 경사로 인한 경우: 구두굽 수정보다는 골반의 수평을 유지하도록 함.');
