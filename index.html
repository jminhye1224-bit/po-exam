Q('H',19,'L','스터럽','금속 발목관절-발 보조기 1) 스터럽 (1) 고정형','고정형 스터럽의 장점은?',['다른 스터럽에 비해 가볍고 인체의 발목관절과 비슷하게 발목관절장치가 위치한다','여러 개의 신발을 바꿔 신을 수 있다','착용이 가장 간편하다','소음이 있으나 내구성이 좋다','구두에서 쉽게 분리된다'],'고정형: 구두에 견고하게 부착, 가벼움, 인체의 발목관절과 비슷하게 발목관절장치가 위치.');
Q('H',19,'L','스터럽','금속 발목관절-발 보조기 1) 스터럽 (2) 분리형','분리형 스터럽의 단점은?',['고정형에 비해 두껍고 무거우며 소음이 있고 내구성이 떨어진다','여러 신발에 쓸 수 없다','착용이 어렵다','장딴지에서 위아래로 움직여 피스톤 작용이 일어난다','구두에 영구적으로 고정된다'],'분리형: 착용 간편, 여러 신발 사용 가능. 다만 고정형에 비해 두껍고 무거우며 소음, 내구성 떨어짐. (피스톤 작용은 캘리퍼의 단점)');
Q('H',19,'L','스터럽','금속 발목관절-발 보조기 1) 스터럽 (3) 캘리퍼','캘리퍼를 잘 사용하지 않는 이유는?',['보조기 몸쪽 부분이 장딴지에서 위아래로 움직여 피부문제와 피스톤 작용이 생기기 때문','두껍고 무겁기 때문','구두에 부착할 수 없기 때문','발목관절장치를 달 수 없기 때문','소아에게만 쓸 수 있기 때문'],'캘리퍼: 몸쪽 부분이 장딴지에서 위아래로 움직여 피부문제, 보행 시 피스톤 작용 → 잘 사용 안 함.');
Q('H',19,'R','인서트','2) 인서트 (2) foot plate','소아마비와 같이 장시간 보조기를 착용해야 하는 경우 주로 사용하는 인서트는?',['foot plate','shoe insert','sandal insert','cookie insert','lateral shoe insert'],'foot plate: 소아마비와 같이 장시간 보조기 착용 시. shoe insert: 발 전체·목말밑관절에 강력한 안가쪽 안정성. sandal insert: 발 변형이 심한 경우.');
Q('H',19,'R','인서트','2) 인서트 (3) sandal insert','sandal insert를 적용하는 경우로 옳은 것은?',['뇌성마비처럼 장딴지근 단축·구축으로 발꿈치가 바닥에 닿지 않는 경우','경증의 발목 삠','당뇨발 궤양','아킬레스건 수술 직후','정강뼈 골절'],'sandal insert: 발의 변형이 심한 경우, 발바닥활이나 다리 길이 교정. 뇌성마비처럼 발꿈치가 바닥에 닿지 않는 경우 등.');
Q('H',19,'R','업라이트','3) 업라이트','금속 AFO에서 피부와 업라이트 사이의 간격은?',['4mm 정도','1~2mm 정도','7~8mm 정도','1cm 정도','2.5cm 정도'],'피부와 업라이트의 간격은 4mm 정도 유지.');
Q('H',19,'R','업라이트','3) 업라이트','하나의 업라이트만 사용할 때 적용 위치의 연결이 옳은 것은?',['가쪽들린휜발증 – 외측, 안쪽들린휜발증 – 내측, 발처짐 – 뒤','가쪽들린휜발증 – 내측, 안쪽들린휜발증 – 외측, 발처짐 – 뒤','가쪽들린휜발증 – 외측, 안쪽들린휜발증 – 내측, 발처짐 – 앞','가쪽들린휜발증 – 뒤, 안쪽들린휜발증 – 앞, 발처짐 – 외측','가쪽들린휜발증 – 내측, 안쪽들린휜발증 – 외측, 발처짐 – 앞'],'가쪽들린휜발증은 외측, 안쪽들린휜발증은 내측, 발처짐은 뒤에 적용.');
Q('H',19,'R','발목축','4) 보조기 발목관절장치','보조기 발목관절장치와 복사뼈 사이에 유지하는 간격은?',['안쪽 복사뼈 7~8mm, 가쪽 복사뼈 3~4mm','안쪽 복사뼈 3~4mm, 가쪽 복사뼈 7~8mm','양쪽 모두 4mm','안쪽 복사뼈 1~2mm, 가쪽 복사뼈 4~5mm','양쪽 모두 1cm'],'안쪽복사뼈와는 7~8mm, 가쪽 복사뼈와는 3~4mm 정도 간격 유지.');
Q('H',19,'R','발목축','4) 보조기 발목관절장치','보조기 발목관절장치에서 저굴과 배굴이 일어나는 축의 기준은?',['안쪽 복사뼈의 먼쪽 경계선과 가쪽 복사뼈 첨부를 연결한 선','안쪽 복사뼈 첨부와 가쪽 복사뼈의 몸쪽 경계선을 연결한 선','양쪽 복사뼈의 중심을 연결한 선','발꿈치뼈와 제1 발허리뼈머리를 연결한 선','종아리뼈머리와 가쪽 복사뼈를 연결한 선'],'이마면에서 보았을 때 안쪽 복사뼈의 먼쪽 경계선과 가쪽 복사뼈 첨부를 연결한 선이 기준.');
Q('H',19,'R','발목장치','4) (1) 자유형 발목관절장치','자유형 발목관절장치를 적용하는 경우는?',['안가쪽 안정성만 필요한 경우','발처짐이 있는 경우','발꿈치뼈보행을 하는 경우','궁둥신경이 손상된 경우','장딴지근 경직이 있는 경우'],'자유형: 안가쪽 안정성이 필요한 경우. PTB형 보조기, 발목 삠, KAFO가 필요한 경우 등에 사용.');
Q('H',19,'R','발목장치','4) (2) ① 앞 정지 발목관절장치','앞 정지 발목관절장치에 대한 설명으로 옳은 것은?',['저굴은 허용하고 배굴은 제한하며 발꿈치뼈보행(종골보행)에 사용한다','배굴은 허용하고 저굴은 제한하며 발처짐에 사용한다','저굴과 배굴을 5~15°만 허용한다','스프링으로 발등굽힘을 보조한다','모든 움직임을 자유롭게 허용한다'],'앞 정지: 저굴 허용, 배굴 제한. 발바닥굽힘근이 약하거나 정강뼈 신경마비로 인한 발꿈치뼈보행·평발보행. 아킬레스건 수술 후 재파열 방지.');
Q('H',19,'R','발목장치','4) (2) ① 앞 정지 발목관절장치','아킬레스건 수술 후 아킬레스건이 늘어나거나 재파열되는 것을 방지하기 위해 사용하는 발목관절장치는?',['앞 정지 발목관절장치','뒤 정지 발목관절장치','클렌작 발목관절장치','자유형 발목관절장치','이중조절 발목관절장치'],'앞 정지(배굴 제한): 아킬레스건 수술 후 늘어나거나 재파열되는 것을 방지.');
Q('H',20,'L','발목장치','② 뒤 정지 발목관절장치','뒤 정지 발목관절장치에 대한 설명으로 옳은 것은?',['발등굽힘은 허용하고 발바닥굽힘은 허용하지 않으며 종아리뼈 신경마비로 인한 발처짐에 사용한다','발바닥굽힘은 허용하고 발등굽힘은 제한한다','발꿈치뼈보행에 사용한다','아킬레스건 수술 후에 사용한다','궁둥신경 손상으로 양쪽 근육이 모두 마비되었을 때 사용한다'],'뒤 정지: 발등굽힘 허용, 발바닥굽힘 제한. 흔듦기 동안 발목이 발바닥굽힘되는 것을 막음. 발처짐, 장딴지근 경직에 사용.');
Q('H',20,'L','발목장치','③ 양방향 제한 발목관절장치','궁둥신경이 손상되어 발바닥굽힘근과 발등굽힘근 모두가 약하거나 마비되었을 때 사용하는 발목관절장치는?',['양방향 제한 발목관절장치','앞 정지 발목관절장치','뒤 정지 발목관절장치','자유형 발목관절장치','클렌작 발목관절장치'],'양방향 제한: 발바닥굽힘이나 발등굽힘 각도를 5°~15° 정도로 허용. 궁둥신경 손상으로 양쪽 근육 모두 약하거나 마비 시.');
Q('H',20,'L','클렌작','(3) ① 클렌작 발목관절장치','클렌작 발목관절장치가 적합하지 않은 환자는?',['경직이나 위운동신경세포병에서 나타나는 간대경련이 있는 환자','종아리 신경 마비로 인한 발처짐 환자','이완성 마비 환자','발등굽힘근이 약한 환자','말초신경 손상 환자'],'클렌작: 스프링에 의한 강하고 갑작스런 배굴이 장딴지 근육을 갑자기 신장시켜 경직·경련을 유발 → 간대경련 환자에게 부적합.');
Q('H',20,'L','클렌작','(3) ① 클렌작 발목관절장치','클렌작 발목관절장치를 착용하고 서 있을 때 발목관절의 각도는?',['90°','80°','100°','85°','95°'],'스프링 강도로 발등굽힘 각도 조절. 클렌작을 착용하고 서 있을 때 발목관절은 90°. 종아리 신경 마비로 인한 발처짐에 많이 사용.');
Q('H',20,'L','운동보조형','(3) ④ shoe-clasp AFO','한 개의 파이버글래스 재질 업라이트를 구두의 월형에 죔쇠로 고정시켜 발등굽힘을 보조하는 보조기는?',['shoe-clasp AFO','wire spring dorsiflexion assist','PLS AFO','클렌작 AFO','spiral AFO'],'shoe-clasp AFO: 파이버글래스 업라이트 1개를 구두 월형에 죔쇠로 고정, 발등굽힘 보조.');
Q('H',20,'L','운동보조형','(3) ② 이중조절 발목관절장치','이중조절 발목관절장치의 장점은?',['사용자의 신체 상태가 호전되거나 악화됨에 따라 조절이 가능하다','가장 가볍다','착용하고 서 있을 때 항상 90°로 고정된다','구두 없이 사용할 수 있다','강선의 반발력을 이용한다'],'이중조절 발목관절장치: 신체 상태가 호전·악화됨에 따라 조절 가능.');
Q('H',20,'L','장딴지밴드','5) 장딴지 밴드','금속 AFO 장딴지 밴드의 위 가장자리 높이 기준과 그 이유는?',['종아리뼈머리 먼쪽 경계선 밑으로 2.5cm – 종아리뼈 신경을 압박하지 않기 위해','종아리뼈머리 먼쪽 경계선 위로 2.5cm – 무릎 굽힘을 막기 위해','종아리뼈머리 먼쪽 경계선 밑으로 4cm – 정강뼈 신경을 보호하기 위해','무릎뼈 아래끝 밑으로 1cm – 무릎뼈힘줄을 보호하기 위해','종아리뼈머리 먼쪽 경계선 밑으로 7~8mm – 복사뼈와 간격을 맞추기 위해'],'장딴지밴드 위 가장자리: 종아리뼈머리의 먼쪽 경계선 밑으로 2.5cm. 종아리뼈머리에서 종아리뼈 신경이 지나가므로 압박하지 않기 위함.');
Q('H',20,'L','장딴지밴드','5) 장딴지 밴드','장딴지 밴드의 폭으로 옳은 것은?',['성인 약 4cm, 소아 약 2.5cm','성인 약 2.5cm, 소아 약 1cm','성인 약 5cm, 소아 약 4cm','성인 약 4cm, 소아 약 1.3cm','성인 약 7cm, 소아 약 4cm'],'밴드의 폭은 약 4cm, 소아의 경우 약 2.5cm. 커프는 밴드 폭보다 약 1cm 더 넓게.');
Q('H',20,'R','장딴지밴드','6) 커프','커프는 밴드에 의한 압박을 피하기 위해 밴드의 폭보다 얼마나 더 넓게 사용하는가?',['약 1cm','약 2.5cm','약 4mm','약 4cm','약 1.3cm'],'커프: 밴드에 의한 압박을 피하기 위해 밴드의 폭보다 약 1cm 정도 더 넓게.');
Q('H',20,'R','AFO스트랩','7) 안가쪽 조절을 위한 부속품','금속 AFO의 바깥굽음 스트랩에 대한 설명으로 옳은 것은?',['구두의 안쪽에 스트랩의 중앙부를 부착하고 맞은편 가쪽 업라이트에서 버클을 조인다','구두의 가쪽에 부착하고 안쪽 업라이트에서 조인다','구두의 안쪽에 부착하고 안쪽 업라이트에서 조인다','구두의 뒤축에 부착하고 장딴지 밴드에서 조인다','구두의 가쪽에 부착하고 가쪽 업라이트에서 조인다'],'바깥굽음 스트랩: 구두 안쪽에 부착 → 가쪽 업라이트에서 버클. 안쪽굽음 스트랩: 구두 가쪽에 부착 → 안쪽 업라이트에서 버클.');
Q('H',20,'R','플라스틱AFO','2. 플라스틱 AFO 1) (1) PLS AFO','PLS AFO에 대한 설명으로 옳은 것은?',['발목부분의 절단가공선이 복사뼈의 뒤에 위치해 발바닥굽힘을 제한하고 발등굽힘을 허용한다','복사뼈 앞에서 절단 가공해 모든 움직임을 제한한다','셸이 360° 회전하며 다리를 감싼다','앞 밴드가 적용되어 무릎을 안정시킨다','복사뼈 위까지만 오는 짧은 형태이다'],'PLS AFO: 절단가공선이 복사뼈 뒤 → 플라스틱 자체가 스프링 역할, 발바닥굽힘 제한·발등굽힘 허용. 발처짐에 사용.');
Q('H',20,'R','플라스틱AFO','2. 플라스틱 AFO 1) (2) solid ankle AFO','solid ankle AFO에 대한 설명으로 옳은 것은?',['복사뼈 앞에서 절단 가공하여 발과 발목관절의 모든 움직임을 제한한다','복사뼈 뒤에서 절단 가공하여 발등굽힘을 허용한다','힌지의 눈금으로 각도를 조절한다','유연한 플라스틱으로 발등 전체를 감싼다','가쪽에서 시작해 180° 회전한다'],'solid ankle AFO: 복사뼈 앞에서 절단 가공, 경직 같은 변형력에 안정적. 모든 움직임 제한, 안쪽굽음·바깥굽음 변형에 교정력.');
Q('H',20,'R','플라스틱AFO','2. 플라스틱 AFO 1) (3) flanged AFO','flanged AFO에서 플랜지를 적용하는 방향으로 옳은 것은?',['발의 뒤침에는 가쪽, 엎침에는 안쪽','발의 뒤침에는 안쪽, 엎침에는 가쪽','뒤침과 엎침 모두 가쪽','뒤침과 엎침 모두 안쪽','뒤침에는 앞쪽, 엎침에는 뒤쪽'],'flanged AFO: 발의 뒤침에는 플랜지를 가쪽에, 엎침에는 안쪽으로 적용.');
Q('H',20,'R','나선형','2. 플라스틱 AFO 1) (4) 나선형(spiral) AFO','나선형(spiral) AFO에 대한 설명으로 옳은 것은?',['슈 인서트의 안쪽에서 시작하여 셸이 360° 회전하면서 다리를 감싼다','슈 인서트의 가쪽에서 시작하여 180° 회전한다','슈 인서트의 안쪽에서 시작하여 180° 회전한다','슈 인서트의 가쪽에서 시작하여 360° 회전한다','슈 인서트의 뒤에서 시작하여 수직으로 올라간다'],'spiral: 안쪽에서 시작, 360° 회전. hemispiral: 가쪽에서 시작, 180° 회전. 둘 다 몸쪽 밴드는 안쪽 정강뼈관절융기까지.');
Q('H',21,'L','나선형','(5) 반나선형(hemispiral) AFO','반나선형(hemispiral) AFO에 대한 설명으로 옳은 것은?',['슈 인서트의 가쪽부터 시작하여 180° 회전하며 부종이나 경직이 심한 경우 사용하지 않는다','슈 인서트의 안쪽부터 시작하여 360° 회전한다','슈 인서트의 안쪽부터 시작하여 180° 회전한다','경직이 심한 경우에 주로 사용한다','앞 밴드로 무릎을 안정시킨다'],'hemispiral: 가쪽에서 시작, 180° 회전. 가쪽 복사뼈를 감쌈. 부종이나 경직이 심한 경우 사용 안 함.');
Q('H',21,'L','GRAFO','(6) ground reaction AFO','지면반력(ground reaction) AFO에 대한 설명으로 옳은 것은?',['앞 밴드가 적용되고 디딤기 초기에 무릎관절을 안정시키는 뒤 힘을 제공한다','뒤 밴드만 적용된다','흔듦기에 발등굽힘을 보조하는 것이 주목적이다','젖힌무릎이 있는 환자에게 적용한다','복사뼈 위까지만 온다'],'지면반력 AFO: 앞 밴드 적용, 무릎관절의 뒤를 통과하는 지면반력을 이용해 디딤기 초기에 무릎 안정. 젖힌무릎을 보이지 않는 넙다리네갈래근 약화 환자.');
Q('H',21,'L','GRAFO','(6) ground reaction AFO','지면반력 AFO를 적용하는 환자는?',['폄근에 경직은 있으나 젖힌무릎을 보이지 않는 넙다리네갈래근이 약한 환자','젖힌무릎이 심한 환자','발등굽힘근만 약한 환자','과다하게 엎침된 유연성 평발 소아','당뇨발 궤양 환자'],'폄근에 경직은 있으나 젖힌무릎을 보이지 않는 넙다리네갈래근이 약한 환자. 척추갈림증, 뇌성마비, 뇌손상, 척수손상 등.');
Q('H',21,'L','SMO','(7) supramalleolar AFO(SMO)','SMO(supramalleolar AFO)에 대한 설명으로 옳은 것은?',['복사뼈 위까지 적용되는 짧은 AFO로 과다하게 엎침된 유연성 평발에 적용한다','무릎 아래까지 오는 긴 AFO이다','카본 복합재료로 만든다','당뇨발의 체중을 경감한다','성인 뇌졸중 환자의 근긴장을 억제한다'],'SMO: 복사뼈 위까지 적용되는 짧은 AFO. 발의 불안정성이 있는 소아, 유연한 플라스틱으로 발등 전체를 감쌈. 과다 엎침된 유연성 평발.');
Q('H',21,'L','관절형AFO','2) 관절형 플라스틱 AFO (1) adjustable posterior strut AFO','조절식 뒤지주 AFO에서 배굴 및 저굴 각도를 조절할 수 있는 범위는?',['15~35°','5~15°','10~15°','20~30°','0~90°'],'adjustable posterior strut AFO: 힌지의 눈금으로 배굴 및 저굴 각도를 15~35° 범위에서 조절. 뇌졸중 환자의 발처짐 예방.');
Q('H',21,'L','카본AFO','3. 카본 복합재료 AFO 1) 양쪽 지주(double rod) AFO','카본 복합재료 양쪽 지주(double rod) AFO가 적합한 환자는?',['정강이뼈 신경 마비가 있는 환자','종아리뼈 신경 마비 환자','샤르코-마리-투스병 환자','허리뼈 수술 후 발처짐 환자','당뇨발 환자'],'양쪽 지주 AFO: 정강이뼈 신경 마비에 적합, 발바닥굽힘이 되지 않도록 유지, 계단·경사로 보행 개선.');
Q('H',21,'R','카본AFO','3. 카본 복합재료 AFO 2) 뒤 지주 AFO','카본 복합재료 뒤 지주 AFO의 적용 대상은?',['발등굽힘근 약증, 종아리뼈 신경 마비, 샤르코-마리-투스병','정강이뼈 신경 마비','당뇨발 궤양','정강뼈 골절','아킬레스건염'],'뒤 지주 AFO: 자연스러운 발구름. 발등굽힘근 약증, 종아리뼈 신경 마비, 샤르코-마리-투스병.');
Q('H',21,'R','체중지지AFO','4. 체중지지 AFO 1) PTB AFO','PTB AFO에 대한 설명으로 옳은 것은?',['정강뼈 골절처럼 하중을 주면 안 될 때 적용하며 하중은 PTB 소켓 브림과 양쪽 업라이트를 통해 먼쪽으로 전달된다','당뇨발 궤양에 전체접촉 캐스트 대신 사용한다','부츠 형태로 rocker bottom 바닥창이 적용된다','발 아래에 별도의 작은 판이 지면에 닿는다','복사뼈 위까지만 적용된다'],'PTB AFO: 정강뼈 골절과 같이 하중을 주어서는 안 될 경우. 하중은 PTB 소켓 브림과 연결된 양쪽 업라이트를 통해 먼쪽까지 전달.');
Q('H',21,'R','체중지지AFO','4. 체중지지 AFO 2) patten bottom orth','완전한 체중경감을 위해 발 아래로 지면에 닿는 별도의 작은 판을 사용하는 보조기는?',['patten bottom orth','PTB AFO','CROW','CAM walker','SMO'],'patten bottom orth: 완전한 체중경감을 위한 보조기, 발 아래로 지면에 닿는 별도의 작은 판.');
Q('H',21,'R','체중지지AFO','4. 체중지지 AFO 4) 샤르코 억제 보조기(CROW)','당뇨발을 관리하기 위해 힘이 발에 전달되는 것을 최소화하며, 발바닥 궤양이나 감각이 없는 발에 전체접촉 캐스트 대신 사용하는 것은?',['샤르코 억제 보조기(CROW)','PTB AFO','patten bottom orth','tone reducing AFO','UCBL'],'CROW: 당뇨발 관리·유지를 위한 체중부하 AFO. 발바닥 궤양이나 감각이 없는 발에 전체접촉 캐스트 대신 사용.');
Q('H',21,'R','체중지지AFO','4. 체중지지 AFO 5) CAM walker','CAM(controlled ankle motion) walker AFO의 특징은?',['부츠 형태의 체중부하 보조기로 압박을 경감시키는 인솔과 rocker bottom 바닥창이 적용된다','카본 지주로 발등굽힘을 보조한다','PTB 소켓 브림으로 하중을 전달한다','복사뼈 위까지만 오는 짧은 보조기이다','스프링으로 발목을 90°로 유지한다'],'CAM walker: 부츠 형태, 인솔 + rocker bottom 바닥창. 발목관절 및 발의 골절, 발바닥 궤양, 연부조직 손상, 아킬레스건염 등.');
Q('H',22,'L','KAFO잠금','KAFO 1) (2) ① drop ring lock knee jt','업라이트에 사각형의 링을 끼워 넣어 잠금 및 풀림 기능을 제공하는 무릎관절장치는?',['drop ring lock knee jt','spring-loaded pull rod knee jt','bail lock knee jt','offset knee jt','dial lock knee jt'],'drop ring lock: 업라이트에 사각형 링. 소아마비나 넙다리네갈래근 약화로 무릎을 고정하고 보행해야 하는 경우 등.');
Q('H',22,'L','KAFO잠금','KAFO 1) (2) ② spring-loaded pull rod knee jt','엉덩관절·허리의 굽힘 구축이나 몸통 운동범위 제한으로 링까지 손을 뻗치지 못하는 경우 사용하는 무릎관절장치는?',['spring-loaded pull rod knee jt','drop ring lock knee jt','bail lock knee jt','offset knee jt','fan lock knee jt'],'spring-loaded pull rod: 봉을 당기면 풀리고 놓으면 스프링으로 자동 잠김. 링까지 손을 뻗치지 못하는 경우. 반신마비 환자에게는 불편, 옷이 걸리는 문제.');
Q('H',22,'L','KAFO잠금','KAFO 1) (2) ③ bail lock knee jt (cam lock)','손을 이용하거나 의자의 모서리로 밀어서 잠금을 푸는 무릎관절장치는?',['bail lock knee jt (cam lock)','drop ring lock knee jt','spring-loaded pull rod knee jt','dial lock knee jt','offset knee jt'],'bail lock(cam lock): 양쪽 업라이트의 톱니멈춤쇠가 뒤의 bail로 연결. 손이나 의자 모서리로 bail을 밀어 사용.');
Q('H',22,'L','KAFO잠금','KAFO 1) (2) ④ offset knee jt','offset knee jt의 원리는?',['돌림축을 업라이트보다 뒤에 위치시켜 지면반력벡터가 돌림축보다 앞에 유지되어 체중부하 동안 폄되려는 경향이 있다','돌림축을 업라이트보다 앞에 위치시켜 굽힘되려는 경향을 만든다','사각형 링으로 잠근다','부채 모양 조절판으로 각도를 바꾼다','스프링으로 자동 잠금된다'],'offset knee jt: 돌림축을 업라이트보다 뒤에 위치 → 지면반력벡터가 돌림축보다 앞 → 체중부하 동안 무릎관절장치가 폄 되려는 경향.');
Q('H',22,'L','KAFO조절','KAFO 1) (3) ① fan lock knee jt','부채 모양의 조절판 각도에 따라 축의 가동범위를 변경하며 일반적으로 drop ring lock과 함께 적용하는 것은?',['fan lock knee jt','dial lock knee jt','bail lock knee jt','offset knee jt','stance control 무릎관절장치'],'fan lock: 부채 모양 조절판, 일반적으로 drop ring lock과 함께 적용.');
Q('H',22,'L','KAFO조절','KAFO 1) (3) ② dial lock knee jt','굽힘과 폄 중 어느 한쪽의 움직임을 허용하고 반대쪽은 제한하거나 모두 제한하는 등 원하는 각도로 조절이 가능한 것은?',['dial lock knee jt','fan lock knee jt','drop ring lock knee jt','bail lock knee jt','offset knee jt'],'dial lock: 굽힘·폄 중 한쪽 허용/반대쪽 제한 또는 모두 제한 등 원하는 각도로 조절.');

const seen=q=>(S.qs[q.id]||{}).s||0;
function buildExam(){
  const N=60,picked=[],has=new Set(),lv=level();
  const add=q=>{if(!q||has.has(q.id)||picked.length>=N)return false;if(q.sec==='T'&&picked.some(x=>x.topic===q.topic))return false;has.add(q.id);picked.push(q);return true};
  const least=list=>shuffle(list).sort((a,b)=>(seen(a)-seen(b))||(lv>1?hard(b)-hard(a):0));
  /* 1) 틀렸던 문제: 두 번 연속 맞힐 때까지 다시 */
  const due=shuffle(BANK.filter(q=>(S.qs[q.id]||{}).d)).sort((a,b)=>S.qs[b.id].w-S.qs[a.id].w).slice(0,26);
  due.forEach(add);
  /* 2) 틀린 문제와 같은 주제의 비슷한 문제 */
  let sib=0;due.forEach(q=>{if(sib>=12)return;if(add(least(BANK.filter(x=>x.topic===q.topic&&!has.has(x.id)))[0]))sib++});
  /* 3) 영역별 비율대로, 덜 본 문제부터 */
  const secs=Object.keys(SEC),cnt={};secs.forEach(s=>cnt[s]=BANK.filter(q=>q.sec===s).length);
  const nonT=BANK.length-cnt.T;
  secs.forEach(s=>{const target=s==='T'?6:Math.round(54*cnt[s]/nonT);let have=picked.filter(q=>q.sec===s).length;for(const q of least(BANK.filter(q=>q.sec===s&&!has.has(q.id)))){if(have>=target)break;if(add(q))have++}});
  for(const q of least(BANK.filter(q=>!has.has(q.id)&&q.sec!=='T'))){if(picked.length>=N)break;add(q)}
  /* 4) 점수가 높으면 연결형 문제로 바꿔 더 헷갈리게 */
  const syn={},dueIds=new Set(due.map(q=>q.id));let need=lv===3?12:lv===2?6:0;
  const qs=shuffle(picked).map(q=>{if(need>0&&!dueIds.has(q.id)&&shortQ(q)){const y=mkSyn(q);if(y){need--;syn[y.id]=y;return y}}return q});
  reg(syn);const order={};qs.forEach(q=>order[q.id]=shuffle([0,1,2,3,4]));
  const now=Date.now();
  return {id:'e'+now.toString(36),start:now,end:now+3600e3,qids:qs.map(q=>q.id),order,ans:{},flag:{},cur:0,syn,lv};
}

  const weakT=Object.keys(tp).filter(k=>tp[k].w>0).sort((a,b)=>tp[b].w-tp[a].w||tp[b].w/tp[b].n-tp[a].w/tp[a].n).slice(0,10);

  return '<section class="card"><h2>회차별 점수</h2><p class="muted">100점 환산 점수입니다. 위 선이 목표인 100점입니다.</p>'+chart+'<ul class="exlist">'+EX.slice().reverse().map(e=>'<li><button class="link" data-act="open" data-id="'+e.id+'">'+(EX.indexOf(e)+1)+'회차 · '+e.date+' · '+e.score+' / '+e.n+' · '+Math.floor(e.dur/60)+'분</button></li>').join('')+'</ul></section>'+
  '<section class="card"><h2>영역별 누적 정답률</h2>'+secTable(items)+'</section>'+
  '<section class="card"><h2>많이 틀리는 주제</h2>'+(weakT.length?'<table class="tbl"><thead><tr><th>주제</th><th>영역</th><th class="num">오답</th><th class="num">출제</th></tr></thead><tbody>'+weakT.map(k=>'<tr><td>'+esc(k)+'</td><td>'+SEC[tp[k].sec]+'</td><td class="num bad">'+tp[k].w+'</td><td class="num">'+tp[k].n+'</td></tr>').join('')+'</tbody></table>':'<p class="lead">아직 틀린 문제가 없습니다.</p>')+'</section>'+
  '<section class="card"><h2>오답이 많은 쪽</h2>'+(pl.length?'<table class="tbl"><tbody>'+pl.map(p=>'<tr><td>한글파일 '+p+'쪽</td><td class="num">'+pg[p]+'개</td><td class="barcell">'+bar(pct(pg[p],pmax),'bad')+'</td></tr>').join('')+'</tbody></table>':'<p class="lead">아직 틀린 문제가 없습니다.</p>')+'</section>'+
  '<section class="card"><h2>가장 많이 틀린 문제</h2>'+(worst.length?'<ul class="memo">'+worst.map(q=>'<li><span class="mq">'+esc(q.stem)+'</span><span class="ma">'+esc(q.opts[0])+'</span><span class="mp">'+S.qs[q.id].w+'번 틀림 · '+q.p+'쪽'+(S.qs[q.id].d?'':' · 통과')+'</span></li>').join('')+'</ul>':'<p class="lead">아직 틀린 문제가 없습니다.</p>')+'</section>'+
  '<section class="card"><h2>기록 백업</h2><p class="muted">기록을 글자로 복사해 메모장 등에 보관해 두면, 기록이 사라졌을 때 아래 칸에 붙여 넣어 되살릴 수 있습니다.</p><div class="row"><button class="btn" data-act="backup">백업 내용 복사</button><span class="muted" id="bk"></span></div><label class="notelabel" for="restore">복원할 백업 내용</label><textarea class="note" id="restore" rows="3" placeholder="복사해 둔 백업 내용을 여기에 붙여 넣으세요"></textarea><div class="row"><button class="btn" data-act="restore">이 내용으로 복원</button></div></section>'+
  '<section class="card"><h2>기록 지우기</h2><p class="muted">모든 시험 기록과 오답노트를 지웁니다. 되돌릴 수 없습니다.</p><div class="row"><button class="btn ghost" data-act="reset1">기록 모두 지우기</button><span id="resetbox"></span></div></section>'+

/* ----- 시험 진행 ----- */
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
function startTick(){drawQ();const t=()=>{if(!P)return;const left=P.end-Date.now(),el=$('#timer');if(el){el.textContent=fmt(left);el.classList.toggle('low',left<5*60e3)}if(left<=0)grade()};t();tick=setInterval(t,500)}
function drawQ(){
  if(!P)return;const id=P.qids[P.cur],q=QMAP[id],ord=P.order[id];
  $('#count').textContent='답한 문제 '+Object.keys(P.ans).length+' / '+P.qids.length;
  $('#qbox').innerHTML='<article class="card q"><div class="chips"><span class="chip">'+(P.cur+1)+' / '+P.qids.length+'</span><button class="chip flagbtn'+(P.flag[id]?' on':'')+'" data-act="flag" aria-pressed="'+(P.flag[id]?'true':'false')+'">'+(P.flag[id]?'헷갈림 표시함':'헷갈려요')+'</button></div><p class="stem">'+(P.cur+1)+'. '+esc(q.stem)+'</p><ul class="opts">'+ord.map((oi,k)=>'<li><button class="opt'+(P.ans[id]===oi?' sel':'')+'" data-act="pick" data-i="'+oi+'"><span class="n">'+NUM[k]+'</span>'+esc(q.opts[oi])+'</button></li>').join('')+'</ul><div class="row between"><button class="btn" data-act="prev"'+(P.cur===0?' disabled':'')+'>이전</button><button class="btn pri" data-act="next">'+(P.cur===P.qids.length-1?'제출하기':'다음')+'</button></div></article>';
  $('#grid').innerHTML=P.qids.map((x,k)=>'<button class="g'+(k===P.cur?' cur':'')+(x in P.ans?' ans':'')+(P.flag[x]?' fl':'')+'" data-act="jump" data-i="'+k+'">'+(k+1)+'</button>').join('');
}
function askSubmit(){const un=P.qids.length-Object.keys(P.ans).length;$('#confirm').innerHTML='<div class="notice"><b>제출할까요?</b> '+(un?'아직 답하지 않은 문제가 '+un+'개 있습니다. 답하지 않은 문제는 오답으로 채점됩니다.':'60문제에 모두 답했습니다.')+'<div class="row"><button class="btn pri" data-act="submit">제출하고 채점</button><button class="btn ghost" data-act="cancel-submit">계속 풀기</button></div></div>';window.scrollTo(0,0)}
function startDrill(){const e=cur||lastExam(),ids=wrongOf(e).map(i=>i.q);drill={queue:shuffle(ids),total:ids.length,tries:0,picked:null,ord:null};if(drill.queue.length)drill.ord=shuffle([0,1,2,3,4]);go('drill')}
function finalText(){const d=today(),td=EX.filter(e=>e.date===d),all=[];td.forEach(e=>wrongOf(e).forEach(i=>{if(!all.includes(i.q))all.push(i.q)}));let t='['+d+' 오늘 정리]\n점수: '+td.map(e=>e.score+'/'+e.n).join(', ')+'\n\n[외울 것]\n';all.forEach(id=>{const q=QMAP[id];t+='- '+q.stem+' → '+q.opts[0]+' ('+q.p+'쪽)\n';if((S.notes[id]||'').trim())t+='  내 정리: '+S.notes[id].trim()+'\n'});const f=(S.days[d]||{}).final;if(f)t+='\n[한 줄 정리]\n'+f+'\n';return t}

const ACT={
  start(){go('ready')},begin(){P=buildExam();saveProg();go('exam')},
  resume(){go('exam')},
  'grade-now'(){grade()},
  discard(){P=null;saveProg();go('home')},
  home(){cur=null;go('home')},stats(){go('stats')},final(){go('final')},
  review(){go('review')},drill(){startDrill()},
  'open-last'(){cur=lastExam();go(wrongOf(cur).length?'review':'result')},
  open(el){cur=EX.find(e=>e.id===el.dataset.id)||null;go('result')},
  pick(el){const id=P.qids[P.cur],i=+el.dataset.i;if(P.ans[id]===i)delete P.ans[id];else P.ans[id]=i;saveProg();drawQ()},
  flag(){const id=P.qids[P.cur];if(P.flag[id])delete P.flag[id];else P.flag[id]=1;saveProg();drawQ()},
  prev(){if(P.cur>0){P.cur--;drawQ();window.scrollTo(0,0)}},
  next(){if(P.cur<P.qids.length-1){P.cur++;drawQ();window.scrollTo(0,0)}else askSubmit()},
  jump(el){P.cur=+el.dataset.i;drawQ();window.scrollTo(0,0)},
  'ask-submit'(){askSubmit()},'cancel-submit'(){$('#confirm').innerHTML=''},submit(){grade()},
  dpick(el){drill.picked=+el.dataset.i;drill.tries++;go('drill')},
  dnext(){const id=drill.queue.shift();if(drill.picked!==0)drill.queue.push(id);drill.picked=null;drill.ord=shuffle([0,1,2,3,4]);go('drill')},
  'copy-final'(){const t=finalText(),done=()=>{$('#copied').textContent='복사했습니다'};try{navigator.clipboard.writeText(t).then(done,()=>{$('#copied').textContent='복사하지 못했습니다. 화면 내용을 직접 선택해 복사해 주세요'})}catch(e){$('#copied').textContent='복사하지 못했습니다. 화면 내용을 직접 선택해 복사해 주세요'}},
  backup(){const t=JSON.stringify({S,EX}),fail=()=>{$('#restore').value=t;$('#bk').textContent='자동 복사가 막혀 있습니다. 아래 칸의 내용을 전체 선택해 복사해 주세요'};try{navigator.clipboard.writeText(t).then(()=>{$('#bk').textContent='복사했습니다. 메모장에 붙여 넣어 보관하세요'},fail)}catch(e){fail()}},
  restore(){let d=null;try{d=JSON.parse($('#restore').value)}catch(e){}if(!d||!d.S||!d.S.qs||!Array.isArray(d.EX)){$('#bk').textContent='백업 내용이 올바르지 않습니다. 복사한 내용 전체를 붙여 넣었는지 확인해 주세요';return}S=Object.assign(BLANK(),d.S);EX=d.EX;EX.forEach(e=>{reg(e.syn);dbWrite('exams/'+e.id,e)});LS.set('exams',EX);saveCore();go('stats')},
  reset1(){$('#resetbox').innerHTML='<button class="btn danger" data-act="reset2">정말 지우기</button>'},
  reset2(){const old=EX.slice();S=BLANK();S.resetAt=Date.now();EX=[];P=null;cur=null;LS.set('exams',EX);saveProg();saveCore();if(db)old.forEach(e=>{chain=chain.then(()=>db.doc('exams/'+e.id).delete()).catch(()=>{})});go('home')}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el)});
let noteT=null;
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.note){S.notes[t.dataset.note]=t.value}else if(t.dataset.day){(S.days[t.dataset.day]||(S.days[t.dataset.day]={})).final=t.value}else return;clearTimeout(noteT);noteT=setTimeout(saveCore,800)});
document.addEventListener('change',ev=>{if(ev.target.id==='examdate'){S.examDate=ev.target.value;saveCore();const d=$('.dday');if(d)d.textContent=dday()}});
document.addEventListener('keydown',ev=>{if(view!=='exam'||!P||ev.target.tagName==='TEXTAREA'||ev.target.tagName==='INPUT')return;if(ev.key>='1'&&ev.key<='5'){const id=P.qids[P.cur];P.ans[id]=P.order[id][+ev.key-1];saveProg();drawQ()}else if(ev.key==='ArrowRight')ACT.next();else if(ev.key==='ArrowLeft')ACT.prev()});

/* ----- 시작 ----- */
(function(){const c=LS.get('core');if(c&&c.qs)S=Object.assign(BLANK(),c);const e=LS.get('exams');if(Array.isArray(e))EX=e;const p=LS.get('prog');if(p&&p.qids&&!EX.some(x=>x.id===p.id))P=p;
  EX=EX.filter(e=>(e.ts||0)>(S.resetAt||0));EX.forEach(e=>reg(e.syn));if(P){reg(P.syn);P.qids=P.qids.filter(id=>QMAP[id])}
  if(!S.examDate){const d=new Date(Date.now()+14*864e5);S.examDate=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  go('home');initDb();})();
</script>
